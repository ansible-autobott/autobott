  http_port: 8080
  https_port: 8443

#============================================================================================================
# Authelia
#============================================================================================================
run_role_authelia: true
authelia:

  secrets:
    session: "CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE"
    # generate with: openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 75
    storage_encryption_key: "CHANGE_ME_CHANGE_ME_CHANGE_ME"
    # generate with: openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 20


  # protected site configurations
  sites:
    - name: fe26
      domain: "fe26.localhost"
      policy: "two_factor" # one_factor | two_factor
      groups:
        - team1

    # aether: members of the aether-admin group get admin rights inside aether
    # (see aether.config.auth.proxy_header.admin_group below).
    - name: aether
      domain: "aether.localhost"
      policy: "one_factor" # one_factor | two_factor
      groups:
        - aether-admin

  # cookie/session domains. these must cover the protected sites above, otherwise
  # authelia cannot issue a session and refuses to start.
  cookies:
    - name: "authelia_session"
      domain: "localhost"
      authelia_url: "https://auth.localhost:8443"

  # user definitions
  users:
    - username: alice
      displayname: "Alice Example"
      password: "changeme"
      salt: "BuMcDk78nYRxSvUXLIKeHZ" # exactly 22 chars
      email: "alice@example.com"
      groups:
        - team1
        - tema2
        - aether-admin # grants admin inside aether
      disabled: false

    - username: tom
      displayname: "Tom Example"
      password: "changeme"
      salt: "BuMcDk78nYRxSvUXLIKeHZ" # exactly 22 chars
      email: "tom@example.com"
      groups:
        - team1
        - tema2
      disabled: true
