#============================================================================================================
# Tools — CLI utilities / developer toolchains (roles/tools/, run on every host)
#============================================================================================================
# Per-user tools (node/nvm, jenv, kubectl's shell config) are set up for the enabled
# linux_basic users of this host (base.yaml: jsmith).
run_role_cli_apps: true
cli_apps_config:
  ytdlp:
  linux-candy:
  dibs:
  todo:

# =========================== # NODE  ===========================
run_role_dev_node: true
dev_node_config:
  node:

# =========================== # GO  ===========================
run_role_dev_go: true
dev_go_config:
  golang:
  goreleaser:
  nfpm:
  golangci-lint:
  go-deps-view:

# =========================== # JAVA  ===========================
run_role_dev_java: true
dev_java_config:
  java_versions:
    - openjdk-21-jdk
    - openjdk-25-jdk
  jenv:
  maven:

# =========================== # K8S  ===========================
run_role_dev_k8s: true
dev_k8s_config:
  kubectl:
  k9s:

# =========================== # AI  ===========================
run_role_dev_ai: true
dev_ai_config:
  herdr:
  claude-code:
  pi:
  copilot-cli:

# =========================== # Other  ===========================
run_role_dev_generic: true
dev_generic_config:
  vagrant:
  vault:
  github-cli:
