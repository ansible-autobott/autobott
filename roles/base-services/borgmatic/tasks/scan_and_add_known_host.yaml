---
- name: Check if host is already in known_hosts - {{ item }}
  ansible.builtin.command: ssh-keygen -F "{{ item }}" -f /root/.ssh/known_hosts
  register: known_host_check
  changed_when: false
  failed_when: false

- name: Get SSH key for {{ item }}
  ansible.builtin.command: "ssh-keyscan -H {{ item }}"
  register: sshkey_output
  changed_when: false
  failed_when: sshkey_output.rc != 0
  when: known_host_check.rc != 0

- name: Fail if SSH key could not be retrieved - {{ item }}
  ansible.builtin.fail:
    msg: >
      Failed to retrieve SSH key for host '{{ item }}'.
      This usually means the host does not resolve or is unreachable.
      ssh-keyscan stderr: {{ sshkey_output.stderr }}
  when:
    - known_host_check.rc != 0
    - sshkey_output.rc != 0

- name: Add host to known_hosts - {{ item }}
  ansible.builtin.known_hosts:
    name: "{{ item }}"
    key: "{{ sshkey_output.stdout }}"
    path: "/root/.ssh/known_hosts"
  when:
    - known_host_check.rc != 0
    - sshkey_output.rc == 0
