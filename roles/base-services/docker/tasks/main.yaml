---
# Docker CE installation and configuration
# This role installs and configures Docker CE on Debian/Ubuntu systems

- name: Main Docker block
  tags:
    - docker
  when:
    - run_role_docker | bool
  block:
    - name: Set merged docker facts
      ansible.builtin.set_fact:
        docker_data: "{{ docker_defaults | combine(docker, recursive=True) }}"

    - name: Remove old Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - docker-desktop
        state: absent
        purge: true
        autoremove: true

    - name: Install required dependencies
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - python3-debian
        state: present
        update_cache: true

    - name: Create Docker GPG key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Copy GPG key for the current distribution
      ansible.builtin.copy:
        src: "files/{{ ansible_facts.distribution | lower }}.gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts.distribution in ['Debian', 'Ubuntu']

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        mode: "0644"

    - name: Remove legacy Docker .list source (migrated to deb822 .sources)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Install Docker CE packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Create Docker daemon configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Configure Docker daemon
      ansible.builtin.template:
        src: daemon.json
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        validate: "dockerd --config-file %s --validate"
      notify:
        - "restart docker"

    - name: Add users to Docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_data.users }}"
      when: docker_data.users | length > 0

    - name: Verify Docker installation
      ansible.builtin.command: docker info
      register: docker_info
      failed_when: docker_info.rc != 0
      changed_when: false

# Docker removal: run_role_docker false (the default) reverts this role and deletes everything Docker holds
# (containers, images, volumes). Changes nothing where Docker is not installed.
- name: Remove Docker
  tags:
    - docker
  when:
    - not (run_role_docker | bool)
  block:
    # Containers go while dockerd runs (with live_restore they would outlive it), then dockerd stops for good, so it
    # cannot recreate the iptables rules removed next
    - name: Remove all Docker containers and stop Docker
      ansible.builtin.shell: |
        set -euo pipefail
        command -v dockerd >/dev/null || exit 0
        systemctl start docker.service
        docker ps --all --quiet | xargs --no-run-if-empty docker rm --force
        systemctl stop docker.socket docker.service containerd.service
        echo "stopped Docker"
      args:
        executable: /bin/bash
      register: docker_stopped
      changed_when: docker_stopped.stdout | length > 0

    - name: Remove the iptables rules and bridges Docker left behind
      ansible.builtin.script:
        cmd: docker-network-cleanup.sh
      register: docker_network_cleanup
      changed_when: docker_network_cleanup.stdout | trim | length > 0

    # No autoremove: what Docker pulled in (e.g. git, iptables) may be in use by now
    - name: Purge Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages + ['docker-ce-rootless-extras'] }}"
        state: absent
        purge: true

    # Left behind by the purge
    - name: Delete Docker data, configuration and apt source
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/docker
        - /var/lib/containerd
        - /etc/docker
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/keyrings/docker.asc

    # Also drops the users docker.users added. linux-basic recreates it if a user lists it in its groups.
    - name: Delete the docker group
      ansible.builtin.group:
        name: docker
        state: absent
