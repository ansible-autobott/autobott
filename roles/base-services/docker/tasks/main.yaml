---
# Docker CE installation and configuration
# This role installs and configures Docker CE on Debian/Ubuntu systems

- name: Main Docker block
  tags:
    - docker
  when:
    - run_role_docker | bool
  block:
    - name: Set merged docker facts
      ansible.builtin.set_fact:
        docker_data: "{{ docker_defaults | combine(docker, recursive=True) }}"

    - name: Remove old Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - docker-desktop
        state: absent
        purge: true
        autoremove: true

    - name: Install required dependencies
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - python3-debian
        state: present
        update_cache: true

    - name: Create Docker GPG key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Copy GPG key for the current distribution
      ansible.builtin.copy:
        src: "files/{{ ansible_facts.distribution | lower }}.gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts.distribution in ['Debian', 'Ubuntu']

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        mode: "0644"

    - name: Remove legacy Docker .list source (migrated to deb822 .sources)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Install Docker CE packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Create Docker daemon configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Configure Docker daemon
      ansible.builtin.template:
        src: daemon.json
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        validate: "dockerd --config-file %s --validate"
      notify:
        - "restart docker"

    - name: Add users to Docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_data.users }}"
      when: docker_data.users | length > 0

    - name: Verify Docker installation
      ansible.builtin.command: docker info
      register: docker_info
      failed_when: docker_info.rc != 0
      changed_when: false
