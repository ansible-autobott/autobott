---
# Install opentailscale

- name: Configure basic Linux system
  tags:
    - "tailscale"
  when:
    - run_role_tailscale | bool
  block:
    - name: Set merged tailscale facts
      ansible.builtin.set_fact:
        tailscale_data: "{{ tailscale_defaults | combine(tailscale, recursive=True) }}"

    - name: Ensure python3-debian is present (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true

    - name: Copy tailscale GPG key
      ansible.builtin.copy:
        src: files/bookworm.noarmor.gpg
        dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"

    - name: Create tailscale APT source
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        # Tailscale publishes separate repos per distro (debian/ubuntu); the
        # signing key is identical across them, so the bundled key works for both.
        uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: main
        signed_by: /etc/apt/keyrings/tailscale-archive-keyring.gpg
        state: present
        mode: "0644"

    - name: Remove legacy tailscale .list source (migrated to deb822 .sources)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/tailscale.list
        state: absent

    - name: Install tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
