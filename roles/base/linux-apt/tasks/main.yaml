---
# ============================================================================================================
# Linux apt
# ============================================================================================================
- name: Linux apt
  tags:
    - "linux-apt"
    - "linux-upgrade"
  when:
    - run_role_linux_apt is defined
    - run_role_linux_apt | bool
  block:
    - name: Set merged linux_apt facts
      ansible.builtin.set_fact:
        linux_apt_data: "{{ linux_apt_defaults | combine(linux_apt, recursive=True) }}"

    # Catalog repositories stay configured once a role has added them. Refresh
    # their keys before the first cache update: if one rotated its signing key,
    # `apt update` fails for every source until the new key is in place.
    - name: "Find catalog repositories already configured on the host"
      ansible.builtin.stat:
        path: "/etc/apt/sources.list.d/{{ item }}.sources"
      loop: "{{ linux_apt_extra_repos_catalog.keys() | list }}"
      register: linux_apt_configured_extra_repos

    - name: "Refresh the signing keys of configured catalog repositories"
      ansible.builtin.copy:
        src: "keyrings/{{ linux_apt_extra_repos_catalog[item].key }}"
        dest: "/etc/apt/keyrings/{{ linux_apt_extra_repos_catalog[item].key }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ linux_apt_configured_extra_repos.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: "Configure APT package sources"
      ansible.builtin.include_tasks:
        file: sources.yaml

    - name: "Configure extra repositories from the catalog"
      ansible.builtin.include_tasks:
        file: extra_repos.yaml
      vars:
        linux_apt_extra_repos_selected: "{{ linux_apt_data.extra_repos }}"
      when: linux_apt_data.extra_repos | default([]) | length > 0

    - name: "Configure pinned backport packages"
      ansible.builtin.include_tasks:
        file: pin-backported-pkg.yaml

    - name: "Perform system updates"
      ansible.builtin.include_tasks:
        file: upgrade.yaml
      when: "'linux-upgrade' in ansible_run_tags"

    - name: "Handle distribution upgrade if needed"
      ansible.builtin.include_tasks:
        file: distupgrade.yaml

      when:
        - linux_apt_data.release | default('') | length > 0
        - ansible_facts.distribution_release != linux_apt_data.release
        - "'linux-upgrade' in ansible_run_tags"

    - name: "Configure automatic updates"
      block:
        - name: "Install automatic update packages"
          ansible.builtin.apt:
            name:
              - unattended-upgrades
              - apt-listchanges
            state: present
            install_recommends: false
          when: linux_apt_data.automatic_updates | bool

        - name: "Trigger initial unattended upgrade"
          ansible.builtin.command:
            cmd: unattended-upgrade -d
          register: upgrade_result
          changed_when: "'No packages found that can be upgraded unattended' not in upgrade_result.stderr"
          when: linux_apt_data.automatic_updates | bool

        - name: "Remove automatic update packages if disabled"
          ansible.builtin.apt:
            name:
              - unattended-upgrades
              - apt-listchanges
            state: absent
            purge: true # Ensure complete removal
          when: not linux_apt_data.automatic_updates | bool

    - name: "Clean up deprecated configurations"
      ansible.builtin.file:
        state: absent
        path: "{{ item }}"
      loop:
        - /etc/cron.d/apt-automatic-updates
        - /etc/apt/sources.list.d/ftp_debian_org_debian.list

    - name: "Clean APT cache"
      ansible.builtin.apt:
        autoclean: true
        cache_valid_time: 3600
