---
#============================================================================================================
# Linux basic setup
#============================================================================================================
# flag that allows to disable the role
run_role_linux_basic: false

# overridable value
linux_basic: {}

linux_basic_defaults:
  packages:
    # list of apps to be installed, bare minimum utils
    default:
      - ca-certificates
      - joe
      - mc
      - aptitude
    # second list of apps that can be defined in a host inventory
    host_defined: []
    # third list of apps that can be defined at group inventory
    group_defined: []
    # list of packages not to be present,  defined in host inventory
    absent_host_defined: []
    # list of packages not to be present,  defined in group inventory
    absent_group_defined: []
  #============================================================================================================
  # Host Config
  #============================================================================================================
  # define the host's fqdn hostname, a single word hostname is possible but not recommended
  # if nothing is set the default fallback is the value of ansible_facts.hostname
  fqdn: ""
  # add extra entries to /etc/hosts
  # example
  # host_entries:
  #  - 127.0.0.1 wiki.localhost
  etc_host_entries: []
  #============================================================================================================
  # SSH
  #============================================================================================================
  ssh:
    # enable X11 forwarding, this should not be needed on a normal server
    x11_forwarding: false
    # special group that will allow passwd auth, default only ssh keys are allowed
    pw_auth_group_name: ""

    # allow to define sftp jails using the regular openssh server
    sftp_jails: []
    #sftp_jails:
    #  - group_name: sftp       # group needs to exist
    #    jail_dir: "/home"      # will be composed as {{ jail_dir }}/%u
    #    start_dir: "/home_dir" # optional, allows to define the default starting dir when opening a session
    #    umask: 0077            # change the umask parameter of the jail default is 0077 creates files as 0700
    #    allow_password: true
    #    remove: false # set to true to remove the sftp jail config

    #  - user_name: sftp        # user needs to exist
    #    jail_dir: "/home"      # jail for the specific user
    #    start_dir: "/home_dir" # optional, allows to define the default starting dir when opening a session
    #    umask: 0077            # change the umask parameter of the jail default is 0077 creates files as 0700
    #    allow_password: true
    #    remove: false # set to true to remove the sftp jail config
  #============================================================================================================
  # Timezone
  #============================================================================================================
  # set / change the timezone of the machine, e.g. "Europe/Zurich"
  timezone: ""
  # this allows to overwrite the setting of the RTC (real time clock)
  # normally on windows the RTC is set to local time and on linux to UTC, you can force linux to use local
  time_rtc: "" # possible values: "local | UTC"

  #============================================================================================================
  # Locale
  #============================================================================================================
  locale:
    # list of locales to be generated (take care to use value from /usr/share/i18n/SUPPORTED,as locale-gen exit with code 0 even with errors...)
    generate:
      - en_US.UTF-8 UTF-8
    # locale to be configured
    set:
      lang: en_US.UTF-8
      language: ""
      ctype: ""
      numeric: ""
      time: ""
      monetary: ""
      paper: ""
      identification: ""
      name: ""
      address: ""
      measurement: ""
      all: en_US.UTF-8

  #============================================================================================================
  # Users
  #============================================================================================================


  groups: []
  #groups:
  #  - name: sftp
  #    gid: 402

  system_users: []
  #system_users:
  #  - username: "tardis"
  #    enabled: true
  #    name: "that blue box"
  #    groups: [ 'trenzalore','gallifrey']
  #    uid: 2001
  #    gid: 2001

  users: []
  #users:
  #  - username: jsmith
  #    name: "The Doctor"
  #    enabled: yes
  #    delete_home: false # if enabled is set to false, determine if the home directory should be deleted
  #    primary_group: "users" # group needs to exist, default "users"
  #    groups: ['sudo', 'trenzalore','gallifrey']  # empty string removes user from all secondary groups
  #    home: "/home/{{ item.username }}"  # allows to change the location of the home
  #    enforce_groups: no
  #    password: "my-secrets-password" # encrypted
  #    shell: /bin/bash # optional
  #    editor: nano # optional, per-user override of the exported $EDITOR/$VISUAL (see linux_basic.editor)
  #    ssh_key:
  #      - "ssh-rsa AAAAA.... john@laptop"
  #      - "ssh-rsa AAAAB.... doctor@desktop"
  #    ssh_key_revoked:
  #      - "ssh-rsa AAAAB.... doctor@desktop"
  #    ssh_config: # entries rendered into the user's ~/.ssh/config as an ansible-managed block
  #      # only keys with a non-empty value are written; set ssh_config: [] to remove the block
  #      - comment: "Personal GitHub (default)" # optional comment line above the entry
  #        host: github.com                     # required: the Host pattern
  #        hostname: github.com
  #        user: git
  #        identity_file: ~/.ssh/private_id_ed25519
  #        identities_only: true
  #        add_keys_to_agent: true
  #        options: # optional escape hatch for any other ssh_config directive
  #          Port: 2222
  #          ProxyJump: bastion
  #    git_config: # rendered into the user's ~/.gitconfig as an ansible-managed block
  #      # content outside the block (incl. keys git itself writes) is preserved; git_config: {} removes it
  #      sections: # [section] key = value; empty values omitted, values escaped only when needed
  #        user:
  #          name: "Andrés Bott"
  #          email: "bott@example.com"
  #        init:
  #          defaultBranch: main
  #      aliases: # list: a string is resolved from git_alias_catalog; a {name: value} is a free-form alias
  #        - "prune-branches"                       # catalogue: the role supplies the command
  #        - co: checkout                           # free-form: you supply the command (escaped for you)
  #        - lg: "log --oneline --graph --decorate"
  #    uid: 2001
  #    gid: 2002
  users_extra: [] # same as users but allows to define users in two inventory places

  #============================================================================================================
  # Shell environment
  #============================================================================================================
  # Default $EDITOR / $VISUAL exported in every managed user's ~/.bashrc. Tools that
  # spawn an editor (git, sops/`make edit-secrets`, crontab, visudo) honour it; leave
  # empty to not set anything (they then fall back to vi). Override per user with
  # users[].editor.
  editor: "" # e.g. "nano", "vim", "micro"

  #============================================================================================================
  # Git
  #============================================================================================================
  # Catalogue of named git aliases. A user enables one by name via
  # users[].git_config.aliases: ["prune-branches"]. Extend/override per host.
  git_alias_catalog:
    # delete local branches whose upstream is gone (run after fetch --prune)
    prune-branches: '!git fetch -p && for branch in $(git branch -vv | grep ": gone]" | awk "{print \$1}"); do git branch -D "$branch"; done'
    co: checkout
    st: status
    br: branch
    last: log -1 HEAD
    unstage: reset HEAD --
    lg: log --oneline --graph --decorate --all

  #============================================================================================================
  # Kernel limits (sysctl)
  #============================================================================================================
  # Explicit kernel limits managed by this role. Each option below maps to a single
  # kernel sysctl key; the values are written to /etc/sysctl.d/60-autobott.conf and
  # applied at runtime with `sysctl --system`. Override per host/group as needed, or
  # set an option to "" to leave that key unmanaged (kernel/distro default applies).
  limits:
    # fs.inotify.max_user_instances — inotify instances per user (kernel default: 128).
    # Raised so file watchers / IDEs / sync tools don't hit
    # "ENOSPC: System limit for number of file watchers reached".
    fs_inotify_max_user_instances: "" # set to 1024 for developer OS

    # fs.inotify.max_user_watches — inotify watches per user. Raise for large media /
    # photo libraries (Jellyfin, Immich), Syncthing or IDEs watching many files.
    fs_inotify_max_user_watches: "" # set to e.g. 524288 for media servers / desktops

    # vm.overcommit_memory — set to 1 so Redis/Valkey background saves don't fail under
    # memory pressure (Immich bundles redis). Host-wide, so it also covers containers.
    vm_overcommit_memory: "" # set to 1 on hosts running redis/valkey (e.g. Immich)
    
    # net.core.somaxconn — TCP listen backlog for busy host services (e.g. the Caddy
    # reverse proxy). Kernel default is 128 on older kernels, 4096 on newer.
    net_core_somaxconn: "" # set to e.g. 1024 on busy web/proxy hosts

    # vm.swappiness — how aggressively the kernel swaps. Lower keeps app pages in RAM,
    # useful on ZFS hosts so it doesn't compete with the ARC.
    vm_swappiness: "" # set to e.g. 10 on ZFS servers

  #============================================================================================================
  # Mixed
  #============================================================================================================
  cron_email: "" # cron will send errors to this email address
  sudo_timeout: "600" # sudo timeout, set to "" to disable
