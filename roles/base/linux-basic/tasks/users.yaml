---
# User and Group Management
# This file manages system users, groups, and their configurations

- name: Configure users and groups
  tags:
    - "linux-basic"
  block:
    # Group Management
    - name: Create system groups
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid | default(omit) }}"
        state: present
      loop: "{{ linux_basic.groups | default([]) }}"

    # Any secondary group referenced by an enabled user/system_user must exist
    # before ansible.builtin.user runs (it assigns membership but never creates
    # groups). Some of these are owned by roles that run later (e.g. docker,
    # vboxusers), so we ensure them here. Creating an already-existing group is a
    # no-op, and the owning package keeps using it (its `addgroup --system` skips
    # an existing group). Pin a gid in linux_basic.groups for any group where it
    # matters.
    - name: Ensure referenced secondary groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: >-
        {{ (linux_basic.users | union(linux_basic.users_extra) | union(linux_basic.system_users | default([])))
        | selectattr('enabled', 'defined') | selectattr('enabled')
        | map(attribute='groups', default=[]) | flatten | unique }}
      loop_control:
        label: "{{ item }}"

    # System Users Management
    - name: Manage system users and their groups
      block:
        - name: Create system user groups
          ansible.builtin.group:
            name: "{{ item.username }}"
            gid: "{{ item.gid | default(omit) }}"
            state: present
          loop: "{{ linux_basic.system_users | default([]) }}"
          when: item.enabled | default(false)

        - name: Create system users
          ansible.builtin.user:
            name: "{{ item.username }}"
            group: "{{ item.username }}"
            groups: "{{ item.groups | default([]) | join(',') }}"
            comment: "{{ item.name | default('') }}"
            uid: "{{ item.uid | default(omit) }}"
            system: true
            state: present
          loop: "{{ linux_basic.system_users | default([]) }}"
          when: item.enabled | default(false)

        - name: Remove disabled system users
          ansible.builtin.user:
            name: "{{ item.username }}"
            state: absent
            remove: true
          loop: "{{ linux_basic.system_users | default([]) }}"
          when: not item.enabled | default(false)

        - name: Remove disabled system user groups
          ansible.builtin.group:
            name: "{{ item.username }}"
            state: absent
          loop: "{{ linux_basic.system_users | default([]) }}"
          when: not item.enabled | default(false)

    # Regular Users Management
    - name: Manage regular users
      block:
        - name: Create and configure regular users
          ansible.builtin.user:
            name: "{{ item.username }}"
            uid: "{{ item.uid | default(omit) }}"
            system: false
            comment: "{{ item.name | default('') }}"
            group: "{{ item.primary_group | default('users') }}"
            groups: "{{ item.groups | default([]) | join(',') }}"
            append: "{{ not item.enforce_groups | default(false) }}"
            shell: "{{ item.shell | default('/bin/bash') }}"
            password: >-
              {{ item.password | default('') | password_hash('sha512', 65534 | random(seed=inventory_hostname) | string)
              if item.password | default('') else '!' }}
            state: present
            create_home: true
            home: "{{ item.home | default( '/home/' ~ item.username  ) }}"
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          #          no_log: true
          when: item.enabled | default(false)

        - name: Configure SSH authorized keys
          ansible.posix.authorized_key:
            user: "{{ item.0.username }}"
            key: "{{ item.1 }}"
            state: present
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) | subelements('ssh_key', skip_missing=True) }}"
          when: item.0.enabled | default(false)

        - name: Remove revoked SSH keys
          ansible.posix.authorized_key:
            user: "{{ item.0.username }}"
            key: "{{ item.1 }}"
            state: absent
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) | subelements('ssh_key_revoked', skip_missing=True) }}"
          when: item.0.enabled | default(false)

        - name: Ensure .ssh directory exists for users with ssh_config
          ansible.builtin.file:
            path: "{{ item.home | default( '/home/' ~ item.username ) }}/.ssh"
            state: directory
            owner: "{{ item.username }}"
            group: "{{ item.primary_group | default('users') }}"
            mode: "0700"
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when:
            - item.enabled | default(false)
            - item.ssh_config | default([]) | length > 0
          loop_control:
            label: "{{ item.username }}"

        - name: Configure user SSH client config
          ansible.builtin.blockinfile:
            path: "{{ item.home | default( '/home/' ~ item.username ) }}/.ssh/config"
            create: true
            owner: "{{ item.username }}"
            group: "{{ item.primary_group | default('users') }}"
            mode: "0600"
            marker: "# {mark} ANSIBLE MANAGED BLOCK - SSH CONFIG"
            block: "{{ lookup('template', 'ssh_config.j2') }}"
            state: "{{ 'present' if (item.ssh_config | default([]) | length > 0) else 'absent' }}"
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when:
            - item.enabled | default(false)
            - item.ssh_config is defined
          loop_control:
            label: "{{ item.username }}"

        - name: Validate git alias catalogue references
          ansible.builtin.assert:
            that: item.1 in linux_basic.git_alias_catalog
            fail_msg: "Unknown git alias '{{ item.1 }}' for user {{ item.0.username }}: not in linux_basic.git_alias_catalog"
            quiet: true
          loop: "{{ (linux_basic.users | union(linux_basic.users_extra)) | subelements('git_config.aliases', skip_missing=True) }}"
          when:
            - item.0.enabled | default(false)
            - item.1 is string
          loop_control:
            label: "{{ item.0.username }}: {{ item.1 }}"

        - name: Configure user git config
          ansible.builtin.blockinfile:
            path: "{{ item.home | default( '/home/' ~ item.username ) }}/.gitconfig"
            create: true
            owner: "{{ item.username }}"
            group: "{{ item.primary_group | default('users') }}"
            mode: "0644"
            marker: "# {mark} ANSIBLE MANAGED BLOCK - GIT CONFIG"
            block: "{{ lookup('template', 'gitconfig.j2') | trim }}"
            state: "{{ 'present' if (item.git_config.sections | default({}) or item.git_config.aliases | default([])) else 'absent' }}"
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when:
            - item.enabled | default(false)
            - item.git_config is defined
          loop_control:
            label: "{{ item.username }}"

        - name: Configure user shell environment
          ansible.builtin.template:
            src: bashrc.j2
            dest: "{{ item.home | default( '/home/' ~ item.username  ) }}/.bashrc"
            owner: "{{ item.username }}"
            group: "{{ item.primary_group | default('users') }}"
            mode: "0600"
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when: item.enabled | default(false)

        - name: Create user shell configuration directory
          ansible.builtin.file:
            path: "{{ item.home | default( '/home/' ~ item.username  ) }}/.bashrc.d"
            state: directory
            owner: "{{ item.username }}"
            group: "{{ item.primary_group | default('users') }}"
            mode: "0750"
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when: item.enabled | default(false)

        - name: Set correct home directory permissions
          ansible.builtin.file:
            path: "{{ item.home | default( '/home/' ~ item.username  ) }}"
            owner: "{{ item.username }}"
            group: "{{ item.primary_group | default('users') }}"
            mode: "0750"
            state: directory
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when: item.enabled | default(false)

    # User Cleanup
    - name: Clean up disabled users
      block:
        - name: Remove disabled users
          ansible.builtin.user:
            name: "{{ item.username }}"
            state: absent
            remove: "{{ item.delete_home | default(false) }}"
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when: not item.enabled | default(false)

        - name: Remove home directories of disabled users
          ansible.builtin.file:
            path: "{{ item.home | default( '/home/' ~ item.username  ) }}"
            state: absent
          loop: "{{ linux_basic.users | union(linux_basic.users_extra) }}"
          when:
            - not item.enabled | default(false)
            - item.delete_home | default(false)
