---
# ============================================================================================================
# Preconditions
# ============================================================================================================
- name: Main preconditions block
  tags:
    - role_preconditions
    - preconditions
    - always
  when:
    - run_role_preconditions | bool
  block:
    - name: Set merged preconditions configuration
      ansible.builtin.set_fact:
        preconditions_config: "{{ preconditions_defaults | combine(preconditions, recursive=true) }}"

    # ====================================================
    # Configuration checks
    # ====================================================
    # Before anything changes on the host: fail on settings that cannot work together. One task per check.
    # Flags of roles in later plays (e.g. k3s) are only defined here when the inventory sets them: default(false)
    # matches their role defaults.

    - name: Fail when both docker and k3s are enabled
      ansible.builtin.fail:
        msg: >-
          run_role_docker and run_role_k3s are both true, but Docker's iptables rules block k3s's ingress traffic.
          Disable one of them (k3s ships its own containerd).
      when:
        - run_role_docker | default(false) | bool
        - run_role_k3s | default(false) | bool

    # run_role_docker false removes Docker
    - name: Fail when a service that runs on Docker is enabled without docker
      ansible.builtin.fail:
        msg: >-
          romm, homepage, docmost, mealie and immich run on Docker, but run_role_docker is false, which removes
          Docker. Enable docker or disable these services.
      when:
        - not (run_role_docker | default(false) | bool)
        - >-
          run_role_romm | default(false) | bool or run_role_homepage | default(false) | bool
          or run_role_docmost | default(false) | bool or run_role_mealie | default(false) | bool
          or run_role_immich | default(false) | bool

    # ====================================================
    # APT sources
    # ====================================================
    - name: Disable the APT sources that make apt-get update fail
      ansible.builtin.script:
        cmd: "apt-disable-broken-sources.sh {{ preconditions_config.apt_sources.protected | map('quote') | join(' ') }}"
      register: preconditions_apt_sources
      changed_when: preconditions_apt_sources.stdout | trim | length > 0
      when: preconditions_config.apt_sources.disable_broken | bool

    - name: Report the disabled APT sources
      ansible.builtin.debug:
        msg: >-
          Disabled APT sources (apt-get update failed for them):
          {{ preconditions_apt_sources.stdout_lines | join(', ') }}.
          The role that manages a source re-enables it.
      when: preconditions_apt_sources.stdout_lines | default([]) | length > 0

    - name: Report why no APT source was disabled
      ansible.builtin.debug:
        msg: "{{ preconditions_apt_sources.stderr | trim }}"
      when:
        - preconditions_apt_sources is not skipped
        - preconditions_apt_sources.stderr | default('') | trim | length > 0
