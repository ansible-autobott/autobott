---
#============================================================================================================
# jellium-desktop
#============================================================================================================
- name: Set merged jellium-desktop configuration
  ansible.builtin.set_fact:
    jellium_desktop_config: "{{ jellium_desktop_defaults | combine(apps_config['jellium-desktop'] | default({}, true), recursive=true) }}"

- name: Purge legacy jellyfin-media-player package (superseded by jellium-desktop)
  ansible.builtin.apt:
    name: jellyfin-media-player
    state: absent
    purge: true

- name: Get current jellium-desktop version
  ansible.builtin.command: "dpkg-query -W -f='${Version}' jellium-desktop"
  register: jellium_desktop_current_version
  failed_when: false
  changed_when: false

- name: Install or update jellium-desktop
  when: jellium_desktop_current_version.stdout != jellium_desktop_config.version
  block:
    - name: Create jellium-desktop download dir
      ansible.builtin.file:
        path: "/tmp/jellium-desktop"
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Download jellium-desktop
      ansible.builtin.get_url:
        url: "https://github.com/andresbott/jellium-desktop/releases/download/v{{ jellium_desktop_config.version }}/jellium-desktop_{{ jellium_desktop_config.version }}_{{ ansible_facts.distribution_release }}_amd64.deb"
        dest: "/tmp/jellium-desktop"

    - name: Install jellium-desktop .deb file
      ansible.builtin.apt:
        deb: "/tmp/jellium-desktop/jellium-desktop_{{ jellium_desktop_config.version }}_{{ ansible_facts.distribution_release }}_amd64.deb"

    - name: Remove jellium-desktop download dir
      ansible.builtin.file:
        path: "/tmp/jellium-desktop"
        state: absent
