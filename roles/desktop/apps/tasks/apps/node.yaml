---
#============================================================================================================
# Node (nvm)
# Special-cased: this file is imported unconditionally by tasks/main.yaml so it
# can uninstall nvm when 'node' is NOT selected in apps_config.
#============================================================================================================
- name: Install Node Version Manager
  when: "'node' in apps_config"
  block:
    - name: Set merged node configuration
      ansible.builtin.set_fact:
        node_config: "{{ node_defaults | combine(apps_config['node'] | default({}, true), recursive=true) }}"

    - name: Check if .nvm exists
      ansible.builtin.stat:
        path: "/home/{{ linux_desktop_config.user }}/.nvm/nvm.sh"
      register: nvm_stat

    - name: Ensure acl is installed
      ansible.builtin.apt:
        name: acl
        state: present

    - name: Copy nvm installer
      ansible.builtin.copy:
        src: node/nvm_0.39.1_install.sh
        dest: /tmp/nvm_0.39.1_install.sh
        owner: root
        group: root
        mode: '0777'
      when: not nvm_stat.stat.exists

    - name: Install NVM
      become: true
      become_user: "{{ linux_desktop_config.user }}"
      ansible.builtin.shell: >
        bash /tmp/nvm_0.39.1_install.sh
      environment:
        NVM_DIR: "/home/{{ linux_desktop_config.user }}/.nvm"
      args:
        creates: "/home/{{ linux_desktop_config.user }}/.nvm/nvm.sh"

    - name: Remove the installer
      ansible.builtin.file:
        path: /tmp/nvm_0.39.1_install.sh
        state: absent
      when: not nvm_stat.stat.exists

    - name: Make sure .bashrc.d exists
      ansible.builtin.file:
        path: "/home/{{ linux_desktop_config.user }}/.bashrc.d"
        state: directory
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_config.user }}"
        mode: '0750'

    - name: Copy .bashrc.d template
      ansible.builtin.template:
        src: node/nvm.bashrc
        dest: "/home/{{ linux_desktop_config.user }}/.bashrc.d/nvm.bashrc"
        mode: '0750'
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_config.user }}"

    - name: Install Node LTS
      become: true
      become_user: "{{ linux_desktop_config.user }}"
      ansible.builtin.shell: "source /home/{{ linux_desktop_config.user }}/.nvm/nvm.sh && nvm install --lts"
      environment:
        NVM_DIR: "/home/{{ linux_desktop_config.user }}/.nvm"
      args:
        executable: /bin/bash
      register: install_node
      changed_when: "'is already installed' not in (install_node.stdout + install_node.stderr)"

- name: Uninstall Node Version Manager
  when: "'node' not in apps_config"
  block:
    - name: Remove .bashrc.d nvm template
      ansible.builtin.file:
        path: "/home/{{ linux_desktop_config.user }}/.bashrc.d/nvm.bashrc"
        state: absent

    - name: Remove .nvm directory
      ansible.builtin.file:
        path: "/home/{{ linux_desktop_config.user }}/.nvm"
        state: absent
