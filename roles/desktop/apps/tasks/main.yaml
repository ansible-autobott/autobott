---
#============================================================================================================
# Unified desktop apps role — main tasks
#============================================================================================================
- name: Desktop apps
  when:
    - run_role_apps | bool
  tags:
    - role_apps
  block:
    - name: Validate apps_config is a mapping
      ansible.builtin.assert:
        that:
          - apps_config is mapping
        fail_msg: "apps_config must be a mapping of app-name -> overrides (or empty), got {{ apps_config | type_debug }}."

    - name: Validate apps_config only references known apps
      ansible.builtin.assert:
        that:
          - (apps_config.keys() | list | difference(apps_available)) | length == 0
        fail_msg: >-
          Unknown app(s) in apps_config:
          {{ apps_config.keys() | list | difference(apps_available) | join(', ') }}.
          Available: {{ apps_available | join(', ') }}

    # --- app catalog (one import_tasks per app; selection via apps_config) ---
    # The whole role is driven by a single tag (role_apps, on the block above);
    # there are no per-app tags. Running the role tag runs every selected app's
    # (idempotent) tasks.
    - name: FreeCAD
      ansible.builtin.import_tasks: apps/freecad.yaml
      when: "'freecad' in apps_config"
    - name: Google Chrome
      ansible.builtin.import_tasks: apps/google-chrome.yaml
      when: "'google-chrome' in apps_config"
    - name: Jellium Desktop
      ansible.builtin.import_tasks: apps/jellium-desktop.yaml
      when: "'jellium-desktop' in apps_config"
    - name: JDownloader
      ansible.builtin.import_tasks: apps/jdownloader.yaml
      when: "'jdownloader' in apps_config"
    - name: PCSX2
      ansible.builtin.import_tasks: apps/pcsx2.yaml
      when: "'pcsx2' in apps_config"
    - name: PrusaSlicer
      ansible.builtin.import_tasks: apps/prusa-slicer.yaml
      when: "'prusa-slicer' in apps_config"
    - name: yt-dlp
      ansible.builtin.import_tasks: apps/ytdlp.yaml
      when: "'ytdlp' in apps_config"
    - name: k9s
      ansible.builtin.import_tasks: apps/k9s.yaml
      when: "'k9s' in apps_config"
    - name: Golang
      ansible.builtin.import_tasks: apps/golang.yaml
      when: "'golang' in apps_config"
    - name: jenv
      ansible.builtin.import_tasks: apps/jenv.yaml
      when: "'jenv' in apps_config"
    - name: maven
      ansible.builtin.import_tasks: apps/maven.yaml
      when: "'maven' in apps_config"
    - name: kubectl
      ansible.builtin.import_tasks: apps/kubectl.yaml
      when: "'kubectl' in apps_config"
    - name: Vagrant
      ansible.builtin.import_tasks: apps/vagrant.yaml
      when: "'vagrant' in apps_config"
    - name: Vault
      ansible.builtin.import_tasks: apps/vault.yaml
      when: "'vault' in apps_config"
    - name: VirtualBox
      ansible.builtin.import_tasks: apps/virtualbox.yaml
      when: "'virtualbox' in apps_config"
    - name: input-remapper
      ansible.builtin.import_tasks: apps/input-remapper.yaml
      when: "'input-remapper' in apps_config"
    - name: herdr
      ansible.builtin.import_tasks: apps/herdr.yaml
      when: "'herdr' in apps_config"
    # candy-tools: shared apt repo (dibs, go-deps-view, linux-candy, todo).
    # Repo is added once if any is selected, then the subset is installed together.
    - name: candy-tools apps
      ansible.builtin.import_tasks: apps/candy-tools.yaml
      when: candy_tools_apps | intersect(apps_config.keys() | list) | length > 0
    # node is special-cased: imported unconditionally so it can uninstall nvm
    # when 'node' is not selected in apps_config (see apps/node.yaml).
    - name: Node
      ansible.builtin.import_tasks: apps/node.yaml
