---
#============================================================================================================
# CLI apps role — defaults
#
# General (non-language-toolchain) CLI utilities. Language/platform developer
# tools live in dedicated roles: dev-node, dev-go, dev-java, dev-k8s and the
# catch-all dev-generic.
#============================================================================================================

# Master on/off for the whole role
run_role_cli_apps: true

# App selection. Keys are app names; value is an optional per-app override
# dict (deep-merged into that app's defaults). Empty value = install with
# defaults. Example:
#   cli_apps_config:
#     ytdlp:
#     linux-candy:
cli_apps_config: {}

# Source of truth for validation — every key allowed in cli_apps_config.
cli_apps_available:
  - ytdlp
  - linux-candy
  - dibs
  - todo

#============================================================================================================
# Per-app defaults
#============================================================================================================

# ----- ytdlp -----
ytdlp_defaults:
  # https://github.com/yt-dlp/yt-dlp/releases
  version: "2023.11.16"

# ----- candy-tools (shared apt repo: dibs, linux-candy, todo) -----
# https://candy-tools.github.io/debian-repo/
# The repo is added once if any of these apps is selected in cli_apps_config,
# then the selected subset is installed together with `apt install`.
# NOTE: the same candy-tools repo also serves go-deps-view, installed by the
# dev-go role.
candy_tools_apps:
  - dibs
  - linux-candy
  - todo
