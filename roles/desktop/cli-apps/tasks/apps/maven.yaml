---
#============================================================================================================
# Apache Maven — build tool (system-wide, installed from the release tarball)
# https://maven.apache.org/
#
# Extracts Maven to /opt/apache-maven-<version>, points a stable /opt/maven
# symlink at it, and links mvn/mvnDebug into /usr/local/bin (already on PATH).
# Maven's launcher resolves MAVEN_HOME through the symlink, so no env setup is
# needed. Maven runs against whatever `java` is active — pairs with the jenv app.
#============================================================================================================
- name: Set merged Maven configuration
  ansible.builtin.set_fact:
    maven_config: "{{ maven_defaults | combine(cli_apps_config['maven'] | default({}, true), recursive=true) }}"

- name: Check whether this Maven version is already installed
  ansible.builtin.stat:
    path: "/opt/apache-maven-{{ maven_config.version }}/bin/mvn"
  register: maven_installed

- name: Install Maven from the release tarball
  when: not maven_installed.stat.exists
  block:
    - name: Download Maven release tarball
      ansible.builtin.get_url:
        url: "{{ maven_config.base_url }}/{{ maven_config.version }}/binaries/apache-maven-{{ maven_config.version }}-bin.tar.gz"
        dest: "/tmp/apache-maven-{{ maven_config.version }}-bin.tar.gz"
        checksum: "sha512:{{ maven_config.sha512 }}"
        owner: root
        group: root
        mode: '0644'

    - name: Install Maven into /opt
      ansible.builtin.unarchive:
        src: "/tmp/apache-maven-{{ maven_config.version }}-bin.tar.gz"
        dest: /opt
        remote_src: true
        owner: root
        group: root

    - name: Remove the Maven tarball
      ansible.builtin.file:
        path: "/tmp/apache-maven-{{ maven_config.version }}-bin.tar.gz"
        state: absent

- name: Point /opt/maven at the installed version
  ansible.builtin.file:
    src: "/opt/apache-maven-{{ maven_config.version }}"
    dest: /opt/maven
    state: link
    force: true

- name: Link mvn and mvnDebug into /usr/local/bin
  ansible.builtin.file:
    src: "/opt/maven/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - mvn
    - mvnDebug
