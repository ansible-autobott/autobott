---
# ============================================================================================================
# CLI apps role — main tasks
# ============================================================================================================
- name: CLI apps
  when:
    - run_role_cli_apps | bool
  tags:
    - role_cli_apps
    - linux-desktop-all
  block:
    - name: Validate cli_apps_config is a mapping
      ansible.builtin.assert:
        that:
          - cli_apps_config is mapping
        fail_msg: "cli_apps_config must be a mapping of app-name -> overrides (or empty), got {{ cli_apps_config | type_debug }}."

    - name: Validate cli_apps_config only references known apps
      ansible.builtin.assert:
        that:
          - (cli_apps_config.keys() | list | difference(cli_apps_available)) | length == 0
        fail_msg: >-
          Unknown app(s) in cli_apps_config:
          {{ cli_apps_config.keys() | list | difference(cli_apps_available) | join(', ') }}.
          Available: {{ cli_apps_available | join(', ') }}

    # --- app catalog (one import_tasks per app; selection via cli_apps_config) ---
    # The whole role is driven by a single tag (role_cli_apps, on the block above);
    # there are no per-app tags. Running the role tag runs every selected app's
    # (idempotent) tasks.
    - name: Yt-dlp
      ansible.builtin.import_tasks: apps/ytdlp.yaml
      when: "'ytdlp' in cli_apps_config"
    # candy-tools: shared apt repo (dibs, linux-candy, todo).
    # Repo is added once if any is selected, then the subset is installed together.
    - name: Candy-tools apps
      ansible.builtin.import_tasks: apps/candy-tools.yaml
      when: candy_tools_apps | intersect(cli_apps_config.keys() | list) | length > 0
