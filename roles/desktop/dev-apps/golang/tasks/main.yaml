---
#============================================================================================================
# Golang Role - Main Tasks
#============================================================================================================
- name: Main Golang block
  tags:
    - golang
    - untagged
  when:
    - run_role_golang | bool
  block:
    - name: Set merged Golang configuration
      ansible.builtin.set_fact:
        golang_config: "{{ golang_defaults | combine(golang, recursive=true) }}"

    - name: Create Go tooling download directory
      file:
        path: /tmp/golang-dl
        state: directory
        owner: root
        group: root
        mode: 0700

    # ============================== Godeb ============================== #
    - name: Download godeb
      get_url:
        url: "{{ golang_config.godeb_url }}"
        dest: /tmp/golang-dl/godeb-amd64.tar.gz
        checksum: "sha256:{{ golang_config.godeb_sha256 }}"
        owner: root
        group: root
        mode: 0644

    - name: Install godeb
      unarchive:
        src: /tmp/golang-dl/godeb-amd64.tar.gz
        dest: "/usr/local/bin/"
        remote_src: yes
        owner:        root
        group:        root
        mode:         0755
      args:
        creates: "/usr/local/bin/godeb"

    # ============================== Go ============================== #
    - name: check if go is installed
      shell:
        cmd: go version 2>&1 | head -1 | cut -d '"' -f 2
      register: result
      check_mode: false
      changed_when: false
      failed_when: result.rc != 0 and result.rc != 127

    - name: get current go version
      shell: "go version | awk '{print $3}' | cut -c3-"
      register: go_current_version
      failed_when: false
      changed_when: false

    - name: Install Go if not installed or outdated
      shell: "/usr/local/bin/godeb install {{ golang_config.go_version }}"
      when: >
        go_current_version.stdout == "" or
        go_current_version.stdout is version( golang_config.go_version, '<')      

    # ============================== goreleaser ============================== #
    - name: Download goreleaser
      get_url:
        url: "{{ golang_config.goreleaser_url }}"
        dest: /tmp/golang-dl/goreleaser.deb
        checksum: "sha256:{{ golang_config.goreleaser_sha256 }}"
        owner: root
        group: root
        mode: 0644

    - name: Install goreleaser
      apt:
        deb: /tmp/golang-dl/goreleaser.deb

    # ============================== nfpm ============================== #
    - name: Download nfpm
      get_url:
        url: "{{ golang_config.nfpm_url }}"
        dest: /tmp/golang-dl/nfpm.deb
        checksum: "sha256:{{ golang_config.nfpm_sha256 }}"
        owner: root
        group: root
        mode: 0644

    - name: Install nfpm
      apt:
        deb: /tmp/golang-dl/nfpm.deb

    # ============================== golangci-lint ============================== #
    - name: Download golangci-lint
      get_url:
        url: "{{ golang_config.golangci_lint_url }}"
        dest: /tmp/golang-dl/golangci-lint.deb
        checksum: "sha256:{{ golang_config.golangci_lint_sha256 }}"
        owner: root
        group: root
        mode: 0644

    - name: Install golangci-lint
      apt:
        deb: /tmp/golang-dl/golangci-lint.deb

    # ============================== Cleanup ============================== #
    - name: Remove Go tooling download directory
      file:
        path: /tmp/golang-dl
        state: absent
