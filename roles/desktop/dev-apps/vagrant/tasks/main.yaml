---
#============================================================================================================
# vagrant Role - Main Tasks
#============================================================================================================
- name: Main vagrant block
  tags:
    - vagrant
    - untagged
  when:
    - run_role_vagrant | bool
  block:
    - name: Set merged vagrant configuration
      ansible.builtin.set_fact:
        vagrant_config: "{{ vagrant_defaults | combine(vagrant, recursive=true) }}"

    - name: Ensure python3-debian is present (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true

    - name: Add HashiCorp GPG key
      ansible.builtin.copy:
        src: hashicorp-archive-keyring.gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.gpg
        mode: "0644"

    - name: Add HashiCorp apt repository
      ansible.builtin.deb822_repository:
        name: hashicorp_vagrant
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: "{{ ansible_distribution_release }}"
        components: main
        architectures: amd64
        signed_by: /usr/share/keyrings/hashicorp-archive-keyring.gpg
        state: present
        mode: "0644"

    - name: Remove legacy HashiCorp .list source (migrated to deb822 .sources)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/hashicorp_vagrant.list
        state: absent

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Vagrant
      ansible.builtin.apt:
        name: vagrant
        state: present
