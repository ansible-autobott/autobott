---
# ============================================================================================================
# golangci-lint — Go linters aggregator (installed from the upstream .deb)
# https://github.com/golangci/golangci-lint/releases
# ============================================================================================================
- name: Resolve the selected golangci-lint version
  ansible.builtin.set_fact:
    golangci_lint_version: "{{ (dev_go_config['golangci-lint'] | default({}, true)).version | default(golangci_lint_default_version, true) }}"

- name: Validate the selected golangci-lint version is available
  ansible.builtin.assert:
    that:
      - golangci_lint_version in golangci_lint_versions
      - dev_go_arch in golangci_lint_versions[golangci_lint_version]
    fail_msg: >-
      Unknown golangci-lint version '{{ golangci_lint_version }}' for {{ dev_go_arch }}.
      Available: {{ golangci_lint_versions | dict2items | selectattr('value', 'contains', dev_go_arch) | map(attribute='key') | join(', ') }}

- name: Get the installed golangci-lint version
  ansible.builtin.command: "dpkg-query -W -f=${Version} golangci-lint"
  register: golangci_lint_current_version
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install or update golangci-lint
  when: golangci_lint_current_version.stdout != golangci_lint_version
  block:
    - name: Create golangci-lint download directory
      ansible.builtin.file:
        path: /tmp/golangci-lint-dl
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Download golangci-lint
      ansible.builtin.get_url:
        url: >-
          https://github.com/golangci/golangci-lint/releases/download/v{{ golangci_lint_version
          }}/golangci-lint-{{ golangci_lint_version }}-linux-{{ dev_go_arch }}.deb
        dest: /tmp/golangci-lint-dl/golangci-lint.deb
        checksum: "sha256:{{ golangci_lint_versions[golangci_lint_version][dev_go_arch] }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install golangci-lint
      ansible.builtin.apt:
        deb: /tmp/golangci-lint-dl/golangci-lint.deb

    - name: Remove golangci-lint download directory
      ansible.builtin.file:
        path: /tmp/golangci-lint-dl
        state: absent
