---
# ============================================================================================================
# dev-k8s — Kubernetes developer tools role — main tasks
# ============================================================================================================
- name: Dev Kubernetes apps
  when:
    - run_role_dev_k8s | bool
  tags:
    - role_dev_k8s
    - linux-desktop-all
  block:
    # A selection whose entries are all commented out parses as null: treat it
    # as "nothing selected" instead of rejecting it below.
    - name: Treat an empty dev_k8s_config as no tools selected
      ansible.builtin.set_fact:
        dev_k8s_config: "{{ dev_k8s_config | default({}, true) }}"

    - name: Validate dev_k8s_config is a mapping
      ansible.builtin.assert:
        that:
          - dev_k8s_config is mapping
        fail_msg: "dev_k8s_config must be a mapping of app-name -> overrides (or empty), got {{ dev_k8s_config | type_debug }}."

    - name: Validate dev_k8s_config only references known apps
      ansible.builtin.assert:
        that:
          - (dev_k8s_config.keys() | list | difference(dev_k8s_available)) | length == 0
        fail_msg: >-
          Unknown app(s) in dev_k8s_config:
          {{ dev_k8s_config.keys() | list | difference(dev_k8s_available) | join(', ') }}.
          Available: {{ dev_k8s_available | join(', ') }}

    # An unmapped architecture passes through unchanged, so a selected tool then
    # fails its checksum lookup with a clear message.
    - name: Resolve the Debian name of the host architecture
      ansible.builtin.set_fact:
        dev_k8s_arch: "{{ dev_k8s_arch_names[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

    # --- app catalog (one import_tasks per app; selection via dev_k8s_config) ---
    # The whole role is driven by a single tag (role_dev_k8s, on the block above);
    # there are no per-app tags. Running the role tag runs every selected app's
    # (idempotent) tasks.
    - name: Kubectl
      ansible.builtin.import_tasks: apps/kubectl.yaml
      when: "'kubectl' in dev_k8s_config"
    - name: K9s
      ansible.builtin.import_tasks: apps/k9s.yaml
      when: "'k9s' in dev_k8s_config"
