---
#============================================================================================================
# GUI desktop apps role — defaults
#============================================================================================================

# Master on/off for the whole role
run_role_gui_apps: true

# App selection. Keys are app names; value is an optional per-app override
# dict (deep-merged into that app's defaults). Empty value = install with
# defaults. Example:
#   gui_apps_config:
#     freecad:
#     google-chrome:
#       extra_profiles: [...]
gui_apps_config: {}

# Source of truth for validation — every key allowed in gui_apps_config.
gui_apps_available:
  - freecad
  - google-chrome
  - jellium-desktop
  - jdownloader
  - pcsx2
  - prusa-slicer
  - virtualbox
  - input-remapper

#============================================================================================================
# Per-app defaults and version catalogs (version -> checksum; sha as a separate lookup)
#
# Apps installed from an apt repo / self-updating installer (google-chrome,
# virtualbox, prusa-slicer, jdownloader) are not version-pinned.
#============================================================================================================

# ----- freecad -----
# https://www.freecad.org/downloads.php  (version -> { url, sha256 } of the AppImage;
# the AppImage filename carries a non-derivable build suffix, so the url is catalogued too)
freecad_default_version: "1.0.2"
freecad_versions:
  "1.0.2":
    url: "https://github.com/FreeCAD/FreeCAD/releases/download/1.0.2/FreeCAD_1.0.2-conda-Linux-x86_64-py311.AppImage"
    sha256: "e00be00ad9fdb12b05c5002bfd1aa2ea8126f2c1d4e2fb603eb7423b72904f61"

# ----- google-chrome -----
# Installed from Google's apt repo (self-updating); no version to pin.
google_chrome_defaults:
  extra_profiles:
    - name: owa # name
      destination: /home/vagrant/programs/owa
      url: "https://outlook.office365.com/mail/inbox" # (optional) default url to open
      desktop:
        desc: "Outlook Web Access"
        generic_name: "Outlook Web Access"
      bin: true # create link in /bin

# ----- jellium-desktop -----
# https://github.com/andresbott/jellium-desktop/releases
# The release .deb is per Debian/Ubuntu release, so the checksum catalog is
# nested: version -> { <distribution_release>: sha256 }.
jellium_desktop_default_version: "0.1.0"
jellium_desktop_versions:
  "0.1.0":
    trixie: "27d424dab1110a879d5cb1133c816c0689c1d187ddf96083d4a57d9f4fc690ef"
    resolute: "1d7c369a7863b4a9b61eef84309801f4104984ed0af470911bc18b811f727af1"

# ----- jdownloader -----
# JDownloader self-updates on launch, so there is no version to pin — the
# official install4j installer always fetches the latest build.
# https://jdownloader.org/download/index
jdownloader_defaults:
  installer_url: "https://installer.jdownloader.org/JD2Setup_x64.sh"
  install_dir: /opt/jdownloader

# ----- pcsx2 -----
# https://github.com/PCSX2/pcsx2/releases  (version -> sha256 of the AppImage)
pcsx2_default_version: "v1.6.0"
pcsx2_versions:
  "v1.6.0": "fae04a860e31ff943d57acbcda6fc2d991489eeafcdf898ddf892facd963b31c"

# ----- prusa-slicer -----
# Installed from the Debian/Ubuntu repos (self-updating); no version to pin.

# ----- virtualbox -----
virtualbox_defaults:
  # virtualbox apt package to install
  package: "virtualbox-7.1"

# ----- input-remapper (input device remapping) -----
# https://github.com/sezanzeb/input-remapper/releases  (version -> sha256 of the .deb)
input_remapper_default_version: "2.2.1"
input_remapper_versions:
  "2.2.1": "6ad397c517a05cc001d45f821122d18506fe3f4d7bf1cb966b012cac54a949d2"
input_remapper_defaults:
  base_url: "https://github.com/sezanzeb/input-remapper/releases/download"
  # Deploy the example user config below into the desktop user's
  # ~/.config/input-remapper-2/ (set false to install the app only).
  deploy_config: true
  # Presets rendered per user. Each entry deploys `template` to
  # presets/<device>/<name>.json and is added to autoload in config.json.
  # Seeded with the current example (M500s mouse tilt-wheel -> Ctrl+PgUp/PgDn).
  presets:
    - device: "Logitech Advanced Corded Mouse M500s"
      name: "new preset"
      template: "input-remapper/presets/m500s.json"
