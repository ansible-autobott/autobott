---
# ============================================================================================================
# FreeCAD
# https://www.freecad.org/  (version -> { url, sha256 } of the AppImage, freecad_versions)
# ============================================================================================================
- name: Resolve the selected FreeCAD version
  ansible.builtin.set_fact:
    freecad_version: "{{ (gui_apps_config['freecad'] | default({}, true)).version | default(freecad_default_version, true) }}"

- name: Validate the selected FreeCAD version is available
  ansible.builtin.assert:
    that:
      - freecad_version in freecad_versions
    fail_msg: >-
      Unknown FreeCAD version '{{ freecad_version }}'.
      Available: {{ freecad_versions.keys() | list | join(', ') }}

- name: Ensure target directory exists
  ansible.builtin.file:
    path: "/opt/freecad/{{ freecad_version }}"
    state: directory
    mode: "0755"

- name: Download FreeCAD AppImage
  ansible.builtin.get_url:
    url: "{{ freecad_versions[freecad_version].url }}"
    dest: "/opt/freecad/{{ freecad_version }}/FreeCAD.AppImage"
    checksum: "sha256:{{ freecad_versions[freecad_version].sha256 }}"
    mode: "0755"

- name: Update symlink to point to current version
  ansible.builtin.file:
    src: "/opt/freecad/{{ freecad_version }}/FreeCAD.AppImage"
    dest: "/usr/local/freecad"
    state: link
    force: true

- name: Copy icon
  ansible.builtin.copy:
    src: freecad/freecad_128.png
    dest: "/opt/freecad/icon.png"
    mode: "0644"
    owner: root
    group: root

- name: Install FreeCAD desktop entry
  ansible.builtin.copy:
    dest: /usr/share/applications/freecad.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=FreeCAD
      Comment=Open-source parametric 3D CAD modeler
      Exec=/usr/local/freecad
      Icon=/opt/freecad/icon.png
      Type=Application
      Categories=Graphics;Engineering;
      Terminal=false
