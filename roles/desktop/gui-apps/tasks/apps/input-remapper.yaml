---
#============================================================================================================
# input-remapper — remap keys/buttons of input devices
# https://github.com/sezanzeb/input-remapper
#
# Installs the upstream .deb (apt resolves its dependencies), enables the system
# daemon, and deploys per-user presets + autoload config for the desktop user.
# Presets are data-driven via input_remapper_config.presets (seeded with the
# current example) and rendered into ~/.config/input-remapper-2/. The package's
# XDG autostart applies them on the next desktop login.
#============================================================================================================
- name: Resolve the selected input-remapper version
  ansible.builtin.set_fact:
    input_remapper_version: "{{ (gui_apps_config['input-remapper'] | default({}, true)).version | default(input_remapper_default_version, true) }}"

- name: Validate the selected input-remapper version is available
  ansible.builtin.assert:
    that:
      - input_remapper_version in input_remapper_versions
    fail_msg: >-
      Unknown input-remapper version '{{ input_remapper_version }}'.
      Available: {{ input_remapper_versions.keys() | list | join(', ') }}

- name: Set merged input-remapper configuration
  ansible.builtin.set_fact:
    input_remapper_config: "{{ input_remapper_defaults | combine(gui_apps_config['input-remapper'] | default({}, true), recursive=true) }}"

# ============================== Install ============================== #
- name: Get installed input-remapper version
  ansible.builtin.command: "dpkg-query -W -f='${Version}' input-remapper"
  register: input_remapper_installed
  failed_when: false
  changed_when: false

- name: Install input-remapper
  when: not (input_remapper_installed.stdout | default('')).startswith(input_remapper_version)
  block:
    - name: Download input-remapper .deb
      ansible.builtin.get_url:
        url: "{{ input_remapper_config.base_url }}/{{ input_remapper_version }}/input-remapper-{{ input_remapper_version }}.deb"
        dest: "/tmp/input-remapper-{{ input_remapper_version }}.deb"
        checksum: "sha256:{{ input_remapper_versions[input_remapper_version] }}"
        owner: root
        group: root
        mode: '0644'

    - name: Install input-remapper (apt resolves dependencies)
      ansible.builtin.apt:
        deb: "/tmp/input-remapper-{{ input_remapper_version }}.deb"

    - name: Remove the input-remapper .deb
      ansible.builtin.file:
        path: "/tmp/input-remapper-{{ input_remapper_version }}.deb"
        state: absent

- name: Enable and start the input-remapper service
  ansible.builtin.systemd_service:
    name: input-remapper.service
    enabled: true
    state: started
    daemon_reload: true

# ============================== User configuration ============================== #
- name: Deploy input-remapper user configuration
  when: input_remapper_config.deploy_config | bool
  block:
    - name: Ensure input-remapper config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_config.user }}"
        mode: '0755'
      loop:
        - "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2"
        - "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/presets"

    - name: Ensure input-remapper preset directories exist
      ansible.builtin.file:
        path: "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/presets/{{ item.device }}"
        state: directory
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_config.user }}"
        mode: '0755'
      loop: "{{ input_remapper_config.presets }}"
      loop_control:
        label: "{{ item.device }}"

    - name: Deploy input-remapper presets
      ansible.builtin.template:
        src: "{{ item.template }}"
        dest: "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/presets/{{ item.device }}/{{ item.name }}.json"
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_config.user }}"
        mode: '0644'
      loop: "{{ input_remapper_config.presets }}"
      loop_control:
        label: "{{ item.device }}/{{ item.name }}"

    - name: Deploy input-remapper autoload config
      ansible.builtin.template:
        src: input-remapper/config.json.j2
        dest: "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/config.json"
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_config.user }}"
        mode: '0644'
