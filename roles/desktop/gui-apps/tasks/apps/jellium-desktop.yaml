---
# ============================================================================================================
# jellium-desktop
# https://github.com/andresbott/jellium-desktop/releases
# The release .deb is per Debian/Ubuntu release, so the checksum catalog is
# nested: version -> { <distribution_release>: sha256 }.
# ============================================================================================================
- name: Resolve the selected jellium-desktop version
  ansible.builtin.set_fact:
    jellium_desktop_version: "{{ (gui_apps_config['jellium-desktop'] | default({}, true)).version | default(jellium_desktop_default_version, true) }}"

- name: Validate the selected jellium-desktop version is available
  ansible.builtin.assert:
    that:
      - jellium_desktop_version in jellium_desktop_versions
    fail_msg: >-
      Unknown jellium-desktop version '{{ jellium_desktop_version }}'.
      Available: {{ jellium_desktop_versions.keys() | list | join(', ') }}

- name: Validate jellium-desktop is available for this distribution release
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution_release in jellium_desktop_versions[jellium_desktop_version]
    fail_msg: >-
      jellium-desktop {{ jellium_desktop_version }} has no catalogued checksum for
      release '{{ ansible_facts.distribution_release }}'.
      Supported: {{ jellium_desktop_versions[jellium_desktop_version].keys() | list | join(', ') }}

- name: Purge legacy jellyfin-media-player package (superseded by jellium-desktop)
  ansible.builtin.apt:
    name: jellyfin-media-player
    state: absent
    purge: true

- name: Get current jellium-desktop version
  ansible.builtin.command: "dpkg-query -W -f='${Version}' jellium-desktop"
  register: jellium_desktop_current_version
  failed_when: false
  changed_when: false

- name: Install or update jellium-desktop
  when: not (jellium_desktop_current_version.stdout | default('')).startswith(jellium_desktop_version)
  vars:
    jellium_desktop_deb: "jellium-desktop_{{ jellium_desktop_version }}_{{ ansible_facts.distribution_release }}_amd64.deb"
  block:
    - name: Create jellium-desktop download dir
      ansible.builtin.file:
        path: "/tmp/jellium-desktop"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Download jellium-desktop
      ansible.builtin.get_url:
        url: "https://github.com/andresbott/jellium-desktop/releases/download/v{{ jellium_desktop_version }}/{{ jellium_desktop_deb }}"
        dest: "/tmp/jellium-desktop/{{ jellium_desktop_deb }}"
        checksum: "sha256:{{ jellium_desktop_versions[jellium_desktop_version][ansible_facts.distribution_release] }}"
        mode: "0644"

    - name: Install jellium-desktop .deb file
      ansible.builtin.apt:
        deb: "/tmp/jellium-desktop/{{ jellium_desktop_deb }}"

    - name: Remove jellium-desktop download dir
      ansible.builtin.file:
        path: "/tmp/jellium-desktop"
        state: absent
