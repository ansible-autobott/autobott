---
# ============================================================================================================
# PCSX2
# https://github.com/PCSX2/pcsx2/releases  (version -> sha256 of the AppImage)
# ============================================================================================================
- name: Resolve the selected pcsx2 version
  ansible.builtin.set_fact:
    pcsx2_version: "{{ (gui_apps_config['pcsx2'] | default({}, true)).version | default(pcsx2_default_version, true) }}"

- name: Validate the selected pcsx2 version is available
  ansible.builtin.assert:
    that:
      - pcsx2_version in pcsx2_versions
    fail_msg: >-
      Unknown pcsx2 version '{{ pcsx2_version }}'.
      Available: {{ pcsx2_versions.keys() | list | join(', ') }}

- name: Ensure pcsx2 install dir exists
  ansible.builtin.file:
    path: "/opt/pcsx2"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Copy icon
  ansible.builtin.copy:
    src: pcsx2/PCSX2.png
    dest: "/opt/pcsx2/icon.png"
    mode: "0644"
    owner: root
    group: root

- name: Get current pcsx2 version
  ansible.builtin.shell: "set -o pipefail && ls -l /opt/pcsx2/ | grep pcsx2 | awk -F ' ' '{print $9}' | awk -F '-' '{print $2}'"
  args:
    executable: /bin/bash
  register: pcsx2_current_version
  failed_when: false
  changed_when: false

- name: Install or update pcsx2
  when: pcsx2_current_version.stdout != pcsx2_version
  block:
    - name: Download pcsx2
      ansible.builtin.get_url:
        url: "https://github.com/PCSX2/pcsx2/releases/download/{{ pcsx2_version }}/pcsx2-{{ pcsx2_version }}-linux-AppImage-32bit.AppImage"
        dest: "/opt/pcsx2/pcsx2-{{ pcsx2_version }}-linux-AppImage-32bit.AppImage"
        checksum: "sha256:{{ pcsx2_versions[pcsx2_version] }}"
        mode: "0755"

    - name: Ensure pcsx2 AppImage is executable
      ansible.builtin.file:
        path: "/opt/pcsx2/pcsx2-{{ pcsx2_version }}-linux-AppImage-32bit.AppImage"
        state: file
        mode: "0755"
        owner: root
        group: root

    - name: Link into usr/local
      ansible.builtin.file:
        src: "/opt/pcsx2/pcsx2-{{ pcsx2_version }}-linux-AppImage-32bit.AppImage"
        dest: /usr/local/bin/pcsx2
        state: link

    - name: Create Desktop entry
      ansible.builtin.template:
        src: pcsx2/pcsx2-desktop.entry.j2
        dest: "/usr/share/applications/pcsx2.desktop"
        mode: "0644"
        owner: root
        group: root
