---
# ============================================================================================================
# PrusaSlicer — installed from the Debian/Ubuntu repos (self-updating; no version to pin).
# The distro package ships its own desktop entry and icon.
# ============================================================================================================
- name: Install PrusaSlicer
  ansible.builtin.apt:
    name: prusa-slicer
    state: present
    update_cache: true

# Clean up the previous AppImage-based install (dropped in favour of the distro package).
- name: Remove the legacy AppImage-based PrusaSlicer install
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/prusa-slicer
    - /usr/share/applications/prusa_slicer.desktop
    - /opt/prusa_slicer
