---
#============================================================================================================
# Linux-desktop Role Defaults
#============================================================================================================

# Main role control variable
run_role_linux_desktop: false

# User override variable - will be combined with defaults
linux_desktop: {}
# Default Linux-desktop configuration structure
linux_desktop_defaults:
  user: "" # define a linux desktop user
  # create folders in the home dir
  folders:
    - "Screenshots"
  #============================================================================================================
  # Git repositories
  #============================================================================================================
  # Clone git repositories into the desktop user's home dir. Repos are cloned only when
  # missing; existing clones are left untouched (no pull on re-run). git is installed
  # automatically when this list is non-empty.
  git_repos: []
  #  - repo: "https://github.com/user/dotfiles.git"  # required: clone URL
  #    dest: "src/dotfiles"                           # required: path, relative to home unless it starts with /
  #    version: ""                                    # optional: branch/tag/commit to check out (default: remote HEAD)
  #============================================================================================================
  # Inventory files
  #============================================================================================================
  # files present on the inventory and copied over to the destination
  # this allows to put a lot of files in place
  inventory_files: []
  #  - file_name: ""
  #    destination: ""
  #    user: ""
  #    group: ""
  #    permissions: ""
  #    extra_vars:
  #      - var1: "value1"
  #    state: "" # possible values are  "present" (copy) | "templated" (copy+ template)| "link" (symlink) | "absent" (delete)

  #============================================================================================================
  # ImageMagick
  #============================================================================================================
  # Install ImageMagick and/or tune its security policy (/etc/ImageMagick-6/policy.xml).
  imagemagick:
    # install the ImageMagick package
    install: false
    policy:
      # path to the policy file (ImageMagick 6 on Debian). The tweaks below are only
      # applied when this file exists — whether installed here or by another role
      # (e.g. linux-kde, mediawiki).
      path: /etc/ImageMagick-6/policy.xml
      # move the URL/HTTP/HTTPS policies to the 'coder' domain so their SSRF deny is
      # actually effective (the 'delegate' form Debian sometimes ships is a no-op).
      # Recommended: true.
      block_remote: false
      # resource-governor caps. "" leaves the value already in policy.xml untouched
      # (i.e. the Debian default shown in parentheses). Raise for heavy image work.
      memory: "" # e.g. "2GiB"  (Debian default: 256MiB)
      map: ""    # e.g. "4GiB"  (Debian default: 512MiB)
      width: ""  # e.g. "20KP"  (Debian default: 16KP)
      height: "" # e.g. "20KP"  (Debian default: 16KP)
      area: ""   # e.g. "256MP" (Debian default: 128MP)
      disk: ""   # e.g. "5GiB"  (Debian default: 1GiB)

  #============================================================================================================
  # Nerd Fonts
  #============================================================================================================
  # Install DejaVu Sans Mono patched by the Nerd Fonts project (adds the icon /
  # Powerline glyphs the plain fonts-dejavu package lacks) system-wide under
  # /usr/local/share/fonts. Consumers reference it by the patched family name
  # "DejaVuSansM Nerd Font" (e.g. the linux-kde Konsole profile). Off by default.
  install_dejavu_nerd_font: true

# Pinned Nerd Fonts release + per-font hash for the DejaVu install above. The
# release tag is shared across any Nerd Font; nerd_font_dejavu_sha256 is the
# DejaVuSansMono.tar.xz hash. Bump via the upgrade-packages workflow and keep the
# hash in sync with the release tarball.
nerd_font_version: v3.5.1
nerd_font_dejavu_sha256: 9d3f2d60faa790b101903c2984b89c11397fc63b9ce43f2dcd25ffed4fb44e5f


