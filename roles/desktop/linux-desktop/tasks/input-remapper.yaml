---
# ============================================================================================================
# input-remapper — remap keys/buttons of input devices
# https://github.com/sezanzeb/input-remapper
#
# Included from linux-desktop's main tasks when
# linux_desktop_config.input_remapper.install is true. Installs input-remapper
# (the distro archive package on Ubuntu, the pinned upstream .deb on Debian —
# see the install tasks below), enables the system daemon, and — when any presets
# are configured — deploys per-user presets + autoload config for the desktop user.
# Presets are data-driven via linux_desktop_config.input_remapper.presets and rendered
# into ~/.config/input-remapper-2/. The package's XDG autostart applies them on the
# next desktop login. The pinned release + hash are role vars (input_remapper_version /
# input_remapper_sha256), bumpable via the upgrade-packages workflow.
# ============================================================================================================
- name: Install and configure input-remapper
  vars:
    ir: "{{ linux_desktop_config.input_remapper }}"
  block:
    # ============================== Install ============================== #
    # Ubuntu ships input-remapper in its own archive, split into
    # input-remapper / -daemon / -gtk; the upstream monolithic .deb conflicts
    # with that split, so on Ubuntu we install the distro package. Debian has no
    # suitable archive package, so there we install the pinned upstream .deb.
    - name: Install input-remapper from the distro archive (Ubuntu)
      ansible.builtin.apt:
        name: input-remapper
        state: present
        update_cache: true
      when: ansible_facts.distribution == "Ubuntu"

    - name: Install input-remapper from the pinned upstream .deb (Debian)
      when: ansible_facts.distribution != "Ubuntu"
      block:
        - name: Get installed input-remapper version
          ansible.builtin.command: "dpkg-query -W -f='${Version}' input-remapper"
          register: input_remapper_installed
          failed_when: false
          changed_when: false

        - name: Install input-remapper
          when: not (input_remapper_installed.stdout | default('')).startswith(input_remapper_version)
          block:
            - name: Download input-remapper .deb
              ansible.builtin.get_url:
                url: "{{ input_remapper_base_url }}/{{ input_remapper_version }}/input-remapper-{{ input_remapper_version }}.deb"
                dest: "/tmp/input-remapper-{{ input_remapper_version }}.deb"
                checksum: "sha256:{{ input_remapper_sha256 }}"
                owner: root
                group: root
                mode: "0644"

            - name: Install input-remapper (apt resolves dependencies)
              ansible.builtin.apt:
                deb: "/tmp/input-remapper-{{ input_remapper_version }}.deb"

            - name: Remove the input-remapper .deb
              ansible.builtin.file:
                path: "/tmp/input-remapper-{{ input_remapper_version }}.deb"
                state: absent

    # Ubuntu's split package names the unit input-remapper-daemon.service (with
    # input-remapper.service as an alias); the upstream Debian .deb ships
    # input-remapper.service directly.
    - name: Enable and start the input-remapper service
      ansible.builtin.systemd_service:
        name: "{{ 'input-remapper-daemon.service' if ansible_facts.distribution == 'Ubuntu' else 'input-remapper.service' }}"
        enabled: true
        state: started
        daemon_reload: true

    # ============================== User configuration ============================== #
    # Presets are optional: only deployed when the desktop user has any configured.
    - name: Deploy input-remapper user configuration
      when: ir.presets | length > 0
      block:
        - name: Ensure input-remapper config directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ linux_desktop_config.user }}"
            group: "{{ linux_desktop_user_main_group }}"
            mode: "0755"
          loop:
            - "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2"
            - "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/presets"

        - name: Ensure input-remapper preset directories exist
          ansible.builtin.file:
            path: "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/presets/{{ item.device }}"
            state: directory
            owner: "{{ linux_desktop_config.user }}"
            group: "{{ linux_desktop_user_main_group }}"
            mode: "0755"
          loop: "{{ ir.presets }}"
          loop_control:
            label: "{{ item.device }}"

        - name: Deploy input-remapper presets
          ansible.builtin.template:
            src: "{{ item.template }}"
            dest: "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/presets/{{ item.device }}/{{ item.name }}.json"
            owner: "{{ linux_desktop_config.user }}"
            group: "{{ linux_desktop_user_main_group }}"
            mode: "0644"
          loop: "{{ ir.presets }}"
          loop_control:
            label: "{{ item.device }}/{{ item.name }}"

        - name: Deploy input-remapper autoload config
          ansible.builtin.template:
            src: input-remapper/config.json.j2
            dest: "/home/{{ linux_desktop_config.user }}/.config/input-remapper-2/config.json"
            owner: "{{ linux_desktop_config.user }}"
            group: "{{ linux_desktop_user_main_group }}"
            mode: "0644"
