---
#============================================================================================================
# Linux-desktop Role - Main Tasks
#============================================================================================================
- name: Main Linux-desktop block
  tags:
    - always        # <- ensures it runs no matter what
    - linux-desktop-all
  block:
    - name: Set merged Linux-desktop configuration
      ansible.builtin.set_fact:
        linux_desktop_config: "{{ linux_desktop_defaults | combine(linux_desktop, recursive=true) }}"

    - fail:
        msg: "linux_desktop_config.user needs to be defined"
      when:
        - linux_desktop_config.user == ""

    - name: Ensure desktop user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ linux_desktop_config.user }}"
      register: user_check
      failed_when: false
      changed_when: false

    - name: Fail if user does not exist
      ansible.builtin.fail:
        msg: "User '{{ linux_desktop_config.user }}' does not exist on this system"
      when: user_check.ansible_facts.getent_passwd[linux_desktop_config.user] is not defined

    - name: "get primary group of desktop user"
      command: "id -g {{ linux_desktop_config.user }}"
      register: desktop_user_result
      changed_when: false

    - name: Set fact with main group
      ansible.builtin.set_fact:
        linux_desktop_user_main_group: "{{ desktop_user_result.stdout }}"

- name: Main Linux-desktop block
  tags:
    - linux_desktop
    - linux-desktop
  when:
    - run_role_linux_desktop | bool
  block:

    - name: create user space folders in the home dir
      file:
        path: "/home/{{ linux_desktop_config.user }}/{{ item }}"
        state: directory
        mode: 0750
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_user_main_group }}"
      with_items: "{{ linux_desktop_config.folders }}"

    #============================================================================================================
    # Git repositories: clone repos into the user's home dir (clone-only; existing clones left untouched)
    #============================================================================================================
    - name: Ensure git is installed for cloning repositories
      ansible.builtin.apt:
        name: git
        state: present
      when: linux_desktop_config.git_repos | length > 0

    - name: Clone git repositories into the home dir
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest if item.dest.startswith('/') else '/home/' ~ linux_desktop_config.user ~ '/' ~ item.dest }}"
        version: "{{ item.version | default('') or omit }}"
        update: false
      become: true
      become_user: "{{ linux_desktop_config.user }}"
      with_items: "{{ linux_desktop_config.git_repos }}"

    #============================================================================================================
    # Inventory files: copy files defined in the inventory to the host
    #============================================================================================================
    - name: inventory files
      ansible.builtin.include_tasks: "inventory_files.yaml"
      with_items: "{{ linux_desktop_config.inventory_files }}"
      when:
        - linux_desktop_config.inventory_files is defined
        - linux_desktop_config.inventory_files | length > 0

    #============================================================================================================
    # common bashrc
    #============================================================================================================

    - name: make sure .bashrc.d exists
      file:
        path: "/home/{{ linux_desktop_config.user }}/.bashrc.d"
        state: directory
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_user_main_group }}"
        mode: 0750

    - name: Copy .bashrc.d template
      template:
        src: bashrc.d/bash_aliases.bashrc
        dest: "/home/{{ linux_desktop_config.user }}/.bashrc.d/10_bash_aliases.bashrc"
        mode: 0750
        owner: "{{ linux_desktop_config.user }}"
        group: "{{ linux_desktop_user_main_group }}"

    #============================================================================================================
    # Nerd Fonts: Hack patched with icon / Powerline glyphs
    #============================================================================================================
    # Installs the Nerd-Fonts-patched Hack font system-wide (under
    # /usr/local/share/fonts) so terminals/editors can render the icon glyphs the
    # stock monospace fonts lack. On by default (install_hack_nerd_font);
    # the pinned release + hash are role vars (nerd_font_version /
    # nerd_font_hack_sha256). The patched family is "Hack Nerd Font Mono"
    # (verified with fc-scan) - that is the string a consumer sets as its
    # font (e.g. the linux-kde Konsole profiles).
    - name: Install the Hack Nerd Font
      when: linux_desktop_config.install_hack_nerd_font | bool
      vars:
        nerd_font_cache_dir: /usr/local/share/autobott/fonts
        nerd_font_install_dir: /usr/local/share/fonts/nerd-fonts/Hack
        nerd_font_hack_tarball: "{{ nerd_font_cache_dir }}/Hack-{{ nerd_font_version }}.tar.xz"
      block:
        - name: Ensure xz-utils is present (required to unpack the .tar.xz)
          ansible.builtin.apt:
            name: xz-utils
            state: present
            update_cache: true

        - name: Ensure the Nerd Font cache + install directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - "{{ nerd_font_cache_dir }}"
            - "{{ nerd_font_install_dir }}"

        - name: Download the pinned Hack Nerd Font release tarball
          ansible.builtin.get_url:
            url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_font_version }}/Hack.tar.xz"
            dest: "{{ nerd_font_hack_tarball }}"
            checksum: "sha256:{{ nerd_font_hack_sha256 }}"
            owner: root
            group: root
            mode: "0644"
          register: nerd_font_download

        - name: Check whether the Nerd Font TTFs are already extracted
          ansible.builtin.stat:
            path: "{{ nerd_font_install_dir }}/HackNerdFontMono-Regular.ttf"
          register: nerd_font_ttf

        # Extract on first install (TTFs missing) or when the pinned tarball
        # changed (version bump). The archive is flat TTFs plus LICENSE/README;
        # keeping the licence beside the fonts is deliberate.
        - name: Extract the Hack Nerd Font
          ansible.builtin.unarchive:
            src: "{{ nerd_font_hack_tarball }}"
            dest: "{{ nerd_font_install_dir }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: nerd_font_download is changed or not nerd_font_ttf.stat.exists
          register: nerd_font_extracted

        # Inline (not a handler) on purpose: the refresh belongs with the
        # extraction that changed the fonts, and the install dir is a block-scoped
        # var a play-level handler could not see.
        - name: Refresh the system font cache  # noqa: no-handler
          ansible.builtin.command: "fc-cache -f {{ nerd_font_install_dir }}"
          when: nerd_font_extracted is changed
          changed_when: true

    #============================================================================================================
    # ImageMagick: install and/or tune /etc/ImageMagick-6/policy.xml
    #============================================================================================================
    - name: ImageMagick
      vars:
        im: "{{ linux_desktop_config.imagemagick }}"
      block:
        - name: Install ImageMagick
          ansible.builtin.apt:
            name: imagemagick
            state: present
            install_recommends: false
          when: im.install | bool

        - name: Tune the ImageMagick security policy
          when: im.policy.path | default('') | length > 0
          block:
            - name: Check whether the ImageMagick policy file exists
              ansible.builtin.stat:
                path: "{{ im.policy.path }}"
              register: im_policy_stat

            - name: Enforce ImageMagick policy settings
              when: im_policy_stat.stat.exists
              block:
                # Only rewrites the domain of an existing URL/HTTP/HTTPS policy line;
                # does nothing if the line is absent, so other protections are preserved.
                - name: Route remote coders (URL/HTTP/HTTPS) through the 'coder' domain
                  ansible.builtin.replace:
                    path: "{{ im.policy.path }}"
                    regexp: '(<policy +)domain="[a-z]+"( +rights="none" +pattern="{{ item }}")'
                    replace: '\g<1>domain="coder"\g<2>'
                  loop:
                    - URL
                    - HTTPS
                    - HTTP
                  when: im.policy.block_remote | bool

                # Only rewrites the value of an existing resource line; skipped when the
                # option is left "" (distro default kept).
                - name: Set ImageMagick resource limits
                  ansible.builtin.replace:
                    path: "{{ im.policy.path }}"
                    regexp: '(<policy +domain="resource" +name="{{ item.name }}" +value=")[^"]*(")'
                    replace: '\g<1>{{ item.value }}\g<2>'
                  loop:
                    - { name: memory, value: "{{ im.policy.memory }}" }
                    - { name: map, value: "{{ im.policy.map }}" }
                    - { name: width, value: "{{ im.policy.width }}" }
                    - { name: height, value: "{{ im.policy.height }}" }
                    - { name: area, value: "{{ im.policy.area }}" }
                    - { name: disk, value: "{{ im.policy.disk }}" }
                  loop_control:
                    label: "{{ item.name }}={{ item.value }}"
                  when: item.value | string | length > 0

    #============================================================================================================
    # input-remapper: install the app + daemon and deploy per-user remapping presets
    #============================================================================================================
    - name: Set up input-remapper
      ansible.builtin.include_tasks: input-remapper.yaml
      when: linux_desktop_config.input_remapper.install | bool
