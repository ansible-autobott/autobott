---
#============================================================================================================
# linux_kde Role Defaults
#============================================================================================================

# Main role control variable
run_role_linux_kde: false

# User override variable - will be combined with defaults
linux_kde: {}
# Default linux_kde configuration structure
linux_kde_defaults:
  add_kde_menu_actions: false
  # KDE global menu (appmenu-gtk-module): install the GTK appmenu modules and set
  # GTK_MODULES so GTK apps export their menu over D-Bus for the Plasma "Global
  # Menu" widget. Debian 13 (trixie) only; a no-op on other releases. You still
  # add the Global Menu widget to a panel yourself (it is a per-user Plasma
  # setting). Note: on some older NVIDIA/X11 setups appmenu-gtk-module can crash
  # GTK apps, hence this is opt-in.
  add_kde_global_menu: false
  # Apply the desktop styling for the primary desktop user: run the
  # distro-appropriate kwriteconfig customizations (Plasma 5 -> kwriteconfig.sh,
  # Plasma 6 -> kwriteconfig6.sh) as that user. On Plasma 6 it also installs the
  # system-wide "AutoBott Panel" layout template so the user can add it from
  # KDE's "Add Panel" menu. Opt-in; re-runs converge.
  add_kde_style: false