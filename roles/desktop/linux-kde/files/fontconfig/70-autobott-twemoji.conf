<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Managed by AutoBott (linux_kde role, add_kde_style). Makes the Twemoji
  colour emoji font (family "Twemoji Mozilla", installed under
  /usr/local/share/fonts/twemoji) the preferred emoji font, replacing the
  stock Noto Color Emoji everywhere emoji are rendered.
-->
<fontconfig>
  <!-- Twemoji is the generic "emoji" family. -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Twemoji Mozilla</family>
    </prefer>
  </alias>

  <!-- And win over an explicit Noto Color Emoji request in a fallback chain. -->
  <match target="pattern">
    <test name="family">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Twemoji Mozilla</string>
    </edit>
  </match>
</fontconfig>
