---
# Ubuntu 26.04 "resolute" (Plasma 6). All package names below are available
# verbatim in the Ubuntu archive, so this mirrors vars/trixie.yaml.

# The autobott apt repo publishes a resolute suite with a klassy built against
# Ubuntu's Qt / KF6 (klassy 6.7.2-1~resolute needs Qt >= 6.10.2, i.e. 26.04 -
# never the ~trixie build), so add_kde_style can install and select it here too.
kde_klassy_available: true
# The GTK global menu (appmenu-gtk-module) stays Debian-trixie-only; that block
# gates on the release itself. The Plasma appmenu service toggle
# (add_kde_global_menu -> kded5rc) applies here too.

kde_packages:
  # core
  - kde-plasma-desktop
  - plasma-nm
  - fonts-dejavu
  - fonts-freefont-ttf
  - sddm-theme-breeze
  - ffmpegthumbnailer
  - kwin-addons
  # extra Plasma widgets used by the AutoBott panel template
  # (kickerdash / Application Dashboard, quicklaunch, ...)
  - plasma-widgets-addons
  - kde-config-gtk-style
  - kde-config-gtk-style-preview

  # apps
  - ark
  - kate
  - okular
  - okular-extra-backends
  - smb4k
  - yakuake
  - kmix
  # screenshots; the shortcuts are set up per user by add_kde_screenshots
  - kde-spectacle
  - flameshot
  - filelight
  - qimgv

kde_theme_packages:
  # themes
  - kde-style-qtcurve-qt5
  - gtk2-engines-qtcurve
  - gtk2-engines-murrine
  - breeze-gtk-theme

kde_packages_purge:
  - plasma-discover
  - gwenview
