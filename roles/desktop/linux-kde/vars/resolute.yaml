---
# Ubuntu 25.10+ / 26.04 "resolute" (Plasma 6). All package names below are
# available verbatim in the Ubuntu archive, so this mirrors vars/trixie.yaml.
# Debian-repo-only extras (Klassy, GTK appmenu) are release-gated in tasks and
# stay skipped on Ubuntu.

kde_packages:
  # core
  - kde-plasma-desktop
  - plasma-nm
  - fonts-dejavu
  - fonts-freefont-ttf
  - sddm-theme-breeze
  - ffmpegthumbnailer
  - kwin-addons
  # extra Plasma widgets used by the AutoBott panel template
  # (kickerdash / Application Dashboard, quicklaunch, ...)
  - plasma-widgets-addons
  - kde-config-gtk-style
  - kde-config-gtk-style-preview

  # apps
  - ark
  - kate
  - okular
  - okular-extra-backends
  - smb4k
  - yakuake
  - kmix
  # screenshots; the shortcuts are set up per user by add_kde_screenshots
  - kde-spectacle
  - flameshot
  - filelight
  - qimgv

kde_theme_packages:
  # themes
  - kde-style-qtcurve-qt5
  - gtk2-engines-qtcurve
  - gtk2-engines-murrine
  - breeze-gtk-theme

kde_packages_purge:
  - plasma-discover
  - gwenview
