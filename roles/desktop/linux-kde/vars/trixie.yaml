
# Script run by the add_kde_style block (as the desktop user) to apply the KDE
# kwriteconfig customizations for this release.
kde_kwriteconfig_script: kwriteconfig6.sh

kde_packages:
  # core
  - kde-plasma-desktop
  - plasma-nm
  - fonts-dejavu
  - fonts-freefont-ttf
  - sddm-theme-breeze
  - ffmpegthumbnailer
  - kwin-addons
  # extra Plasma widgets used by the AutoBott panel template
  # (kickerdash / Application Dashboard, quicklaunch, ...)
  - plasma-widgets-addons
  - kde-config-gtk-style
  - kde-config-gtk-style-preview

  # apps
  - ark
  - kate
  - okular
  - okular-extra-backends
  - smb4k
  - yakuake
  - kmix
  - flameshot
  - filelight    
  - qimgv

kde_theme_packages:
  # themes
  - kde-style-qtcurve-qt5
  - gtk2-engines-qtcurve
  - gtk2-engines-murrine
  - breeze-gtk-theme

kde_packages_purge:
  - plasma-discover
  - kde-spectacle
  - gwenview

# Plasma "Add Panel" layout template installed by the linux_kde add_kde_style
# block. Names both the source dir under files/plasma-layout-templates/ and the
# install dir under /usr/share/plasma/layout-templates/. Defined only for this
# Plasma 6 release; it is intentionally absent from the Plasma 5 (bookworm) vars
# so the panel install no-ops there.
kde_panel_layout_template: org.autobott.plasma.desktop.panel
