# ============================================================================================================
# vbox_guest Role - Main Tasks
# ============================================================================================================
- name: Main vbox_guest block
  tags:
    - role_vbox_guest
    - vbox_guest
    - vbox-guest
    - linux-desktop-all
  when:
    - run_role_vbox_guest | bool
  block:
    - name: Require a supported guest architecture
      ansible.builtin.assert:
        that: ansible_facts.architecture in vbox_guest_installers
        fail_msg: >-
          vbox_guest: unsupported architecture '{{ ansible_facts.architecture }}'.
          Supported: {{ vbox_guest_installers.keys() | list | join(', ') }}
        quiet: true

    - name: Require a checksum for the selected Guest Additions version
      ansible.builtin.assert:
        that: vbox_guest_version in vbox_guest_versions
        fail_msg: >-
          vbox_guest: no checksum for version '{{ vbox_guest_version }}' in vbox_guest_versions.
          Known: {{ vbox_guest_versions.keys() | list | join(', ') }}
        quiet: true

    # Prints e.g. "7.2.20r170000"; fails (binary missing) before the first install.
    - name: Get the installed Guest Additions version
      ansible.builtin.command: VBoxControl --version
      register: vbox_guest_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # The installer records its version even when the module build fails, so also check
    # that the module exists for the running kernel (it builds them into <kernel>/misc).
    - name: Find the Guest Additions kernel module built for the running kernel
      ansible.builtin.find:
        paths: "/lib/modules/{{ ansible_facts.kernel }}/misc"
        patterns: "vboxguest.ko*"
      register: vbox_guest_module

    - name: Install Guest Additions {{ vbox_guest_version }}
      when: >-
        (vbox_guest_installed.stdout | default('') | regex_replace('r[0-9]+$', '')) != vbox_guest_version
        or vbox_guest_module.matched == 0
      vars:
        vbox_guest_iso: "/tmp/VBoxGuestAdditions_{{ vbox_guest_version }}.iso"
        vbox_guest_mount: /mnt/vbox
      block:
        - name: Ensure the packages to build the kernel modules are installed
          ansible.builtin.apt:
            name:
              - build-essential
              - bzip2
              - "linux-headers-{{ ansible_facts.kernel }}"
            state: present
            update_cache: true

        - name: Download the Guest Additions ISO
          ansible.builtin.get_url:
            url: "https://download.virtualbox.org/virtualbox/{{ vbox_guest_version }}/VBoxGuestAdditions_{{ vbox_guest_version }}.iso"
            dest: "{{ vbox_guest_iso }}"
            checksum: "sha256:{{ vbox_guest_versions[vbox_guest_version] }}"
            mode: "0644"

        # ephemeral: mount without adding an /etc/fstab entry (which would outlive the ISO)
        - name: Mount the Guest Additions ISO
          ansible.posix.mount:
            path: "{{ vbox_guest_mount }}"
            src: "{{ vbox_guest_iso }}"
            fstype: iso9660
            opts: loop,ro
            state: ephemeral

        # rc 2: installed, but the old modules are still loaded; the new ones load after a reboot
        - name: Run the Guest Additions installer
          ansible.builtin.command: "sh {{ vbox_guest_mount }}/{{ vbox_guest_installers[ansible_facts.architecture] }}"
          register: vbox_guest_install
          failed_when: vbox_guest_install.rc not in [0, 2]
          changed_when: true

        - name: Report that a reboot is needed to load the new modules
          ansible.builtin.debug:
            msg: "Guest Additions {{ vbox_guest_version }} installed; reboot to load the new kernel modules."
          when: vbox_guest_install.rc == 2

      always:
        - name: Unmount the Guest Additions ISO
          ansible.posix.mount:
            path: "{{ vbox_guest_mount }}"
            state: unmounted

        - name: Remove the Guest Additions ISO
          ansible.builtin.file:
            path: "{{ vbox_guest_iso }}"
            state: absent
