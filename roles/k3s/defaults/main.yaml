---
# ============================================================================================================
# K3s
# ============================================================================================================
# Single-node k3s server: binary installation + server configuration (Calico CNI, k3s default ingress:
# Traefik on ports 80/443 via ServiceLB).
# See About.md for the architecture.

# Role execution control
run_role_k3s: false

# User configuration override (will be merged with k3s_defaults)
k3s: {}

# Default configuration structure
k3s_defaults:
  # k3s version to install (must have a matching entry in k3s_checksums). Changing it restarts k3s on the new version;
  # pods keep running. Upgrade one minor version at a time (1.34 -> 1.35 -> 1.36): the role refuses to skip a minor
  # version or to go back one.
  version: 1.35.1+k3s1

  # Extra TLS Subject Alternative Names for the API server certificate
  # Example: ["my-k3s.example.com", "192.168.1.100"]
  tls_san: []

  # Cluster CIDR
  cluster_cidr: 10.42.0.0/16

  # Service CIDR
  service_cidr: 10.43.0.0/16

  # Cluster DNS address
  cluster_dns: 10.43.0.10

  # Calico CNI configuration
  calico:
    version: 3.29.3

  # Extra arguments passed to k3s server
  # Example: ["--node-label=environment=production"]
  extra_args: []

  # Host ports ServiceLB publishes for LoadBalancer Services: Traefik's web (80) and websecure (443).
  # ServiceLB uses iptables redirects, not listening sockets, so a program already listening on one of these
  # ports would silently lose its traffic: the role fails instead. Add the ports of any other LoadBalancer Service.
  servicelb_ports:
    - 80
    - 443

  # Redirect every HTTP request (port 80) to HTTPS (port 443) with a permanent redirect, cluster-wide in Traefik:
  # apps need no redirect of their own. Turn it on once the sites have real certificates: until then HTTPS serves
  # Traefik's self-signed one, and browsers keep a permanent redirect cached even after it is turned off.
  https_redirect: false

# Supported k3s versions and checksums (sha256 of the k3s binary)
k3s_checksums:
  "1.32.3+k3s1": "b19216803650b567bf980888dec39035edaf664339c55bc4462f7a003edbef83"
  "1.35.1+k3s1": "e406ca6e47673d747ab4665c90a9285615fe082e2593343725ed043ae163abbf"
