---
#============================================================================================================
# K3s Role
#============================================================================================================
# Installs the k3s binary and configures/starts k3s in server mode with Calico CNI
# and Traefik (HTTP-only). See About.md for the architecture.

- name: Main k3s installation
  tags:
    - k3s
    - untagged
  when: run_role_k3s | bool
  block:
    - name: Set merged k3s configuration
      ansible.builtin.set_fact:
        k3s_config: "{{ k3s_defaults | combine(k3s, recursive=true) }}"

    #====================================================
    # Directories
    #====================================================

    - name: Create k3s directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/rancher/k3s
        - /var/lib/rancher/k3s
        - /opt/k3s/install

    #====================================================
    # Binary Download
    #====================================================

    - name: Download k3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/v{{ k3s_config.version | replace('+', '%2B') }}/k3s"
        dest: "/opt/k3s/install/k3s-{{ k3s_config.version }}"
        owner: root
        group: root
        mode: "0755"
        checksum: "sha256:{{ k3s_checksums[k3s_config.version] }}"

    - name: Link k3s to /usr/local/bin
      ansible.builtin.file:
        src: "/opt/k3s/install/k3s-{{ k3s_config.version }}"
        dest: /usr/local/bin/k3s
        state: link

    #====================================================
    # Cleanup old versions
    #====================================================

    - name: Find old k3s binaries
      ansible.builtin.find:
        paths: /opt/k3s/install
        patterns: "k3s-*"
        use_regex: false
      register: k3s_old_binaries

    - name: Delete outdated k3s binaries
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ k3s_old_binaries.files }}"
      when: "'k3s-' ~ k3s_config.version not in item.path"

    #====================================================
    # Symlinks (kubectl, crictl, ctr)
    #====================================================

    - name: Create k3s tool symlinks
      ansible.builtin.file:
        src: /usr/local/bin/k3s
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kubectl
        - crictl
        - ctr

    #====================================================
    # Access control
    #====================================================

    - name: Create k3s-admin group
      ansible.builtin.group:
        name: k3s-admin
        state: present

    - name: Add users to k3s-admin group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: k3s-admin
        append: true
      loop: "{{ k3s_config.admins }}"

    #====================================================
    # Config
    #====================================================

    - name: Create k3s server configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
      notify:
        - restart k3s

    #====================================================
    # Service
    #====================================================

    - name: Setup k3s server systemd service
      ansible.builtin.template:
        src: k3s.service.j2
        dest: /lib/systemd/system/k3s.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart k3s

    - name: Enable and start k3s server
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    #====================================================
    # Calico CNI
    #====================================================

    - name: Wait for k3s to be ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      register: k3s_ready
      retries: 30
      delay: 5
      until: k3s_ready.rc == 0
      changed_when: false

    - name: Deploy Calico kubernetes-services-endpoint ConfigMap
      ansible.builtin.copy:
        src: files/calico-kubernetes-services-endpoint.yaml
        dest: /var/lib/rancher/k3s/server/manifests/calico-kubernetes-services-endpoint.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Deploy Calico manifest
      ansible.builtin.template:
        src: calico.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/calico.yaml
        owner: root
        group: root
        mode: "0600"

    #====================================================
    # Traefik ingress (HTTP-only, localhost)
    #====================================================

    - name: Configure Traefik for HTTP-only on localhost
      ansible.builtin.copy:
        src: files/traefik-config.yaml
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        owner: root
        group: root
        mode: "0600"

    #====================================================
    # Kill script (standard k3s tooling)
    #====================================================

    - name: Install k3s-killall script
      ansible.builtin.template:
        src: k3s-killall.sh.j2
        dest: /usr/local/bin/k3s-killall.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install k3s-reset script
      ansible.builtin.template:
        src: k3s-reset.sh.j2
        dest: /usr/local/bin/k3s-reset.sh
        owner: root
        group: root
        mode: "0755"

    #====================================================
    # Shell environment
    #====================================================

    - name: Set KUBECONFIG for all users via profile.d
      ansible.builtin.copy:
        dest: /etc/profile.d/k3s.sh
        content: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        owner: root
        group: root
        mode: "0644"
