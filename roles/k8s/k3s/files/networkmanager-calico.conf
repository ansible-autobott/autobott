# Managed by autobott (k3s role): NetworkManager must not touch Calico's interfaces (pod veths, tunnels),
# Calico configures them and their routes itself. Calico docs: "Configure NetworkManager".
[keyfile]
unmanaged-devices=interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
