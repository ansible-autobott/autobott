---
# ============================================================================================================
# K3s Role
# ============================================================================================================
# Installs the k3s binary and configures/starts k3s in server mode with Calico CNI.
# Ingress is the k3s default: Traefik on ports 80/443 via ServiceLB. See About.md for the architecture.

- name: Main k3s installation
  tags:
    - k3s
  when: run_role_k3s | bool
  block:
    # always: the firewall tasks imported below also run with -t firewall and need k3s_config
    - name: Set merged k3s configuration
      tags:
        - always
      ansible.builtin.set_fact:
        k3s_config: "{{ k3s_defaults | combine(k3s, recursive=true) }}"

    - name: Fail on a k3s version without a checksum
      ansible.builtin.assert:
        that:
          - k3s_config.version in k3s_checksums
        fail_msg: >-
          k3s.version {{ k3s_config.version }} has no checksum in k3s_checksums: add the sha256 of its k3s binary
          there (known versions: {{ k3s_checksums.keys() | join(', ') }}).
        quiet: true

    # Kubernetes upgrades one minor version at a time, and going back a minor version needs a restore of a datastore
    # backup taken on it (docs.k3s.io/upgrades). Checked against the version the server runs, not the installed binary:
    # after a run that failed before restarting k3s, the binary is already the new one. Empty on a fresh host or while
    # k3s is down: nothing to compare.
    - name: Read the version of the running k3s server
      ansible.builtin.command: /usr/local/bin/k3s kubectl version --output=json --request-timeout=10s
      register: k3s_server_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Set the version of the running k3s server
      ansible.builtin.set_fact:
        k3s_running_version: >-
          {{ (k3s_server_version.stdout | from_json).serverVersion.gitVersion | regex_replace('^v', '')
          if k3s_server_version.rc == 0 else '' }}

    - name: Fail on a k3s version change that skips or goes back a minor version
      when: k3s_running_version | length > 0
      ansible.builtin.assert:
        that:
          - (k3s_config.version.split('.')[1] | int) - (k3s_running_version.split('.')[1] | int) in [0, 1]
        fail_msg: >-
          k3s {{ k3s_running_version }} runs here, and k3s.version {{ k3s_config.version }} would skip or go back a
          minor version. Upgrade one minor version at a time: add a release of each minor version in between to
          k3s_checksums and run the role once per step. Going back a minor version needs a restore of a datastore
          backup taken on it (docs.k3s.io/upgrades/roll-back).
        quiet: true

    # ServiceLB publishes ports with iptables redirects, not listening sockets: a program already listening on one
    # of them would not make k3s fail, it would silently lose its traffic. Fail before installing anything instead.
    # k3s itself never listens on these ports, so re-runs pass.
    - name: Gather listening ports
      community.general.listen_ports_facts:

    - name: Fail if another program listens on a port ServiceLB publishes
      vars:
        k3s_published_ports: "{{ [k3s_config.http_port, k3s_config.https_port] + k3s_config.servicelb_ports }}"
      ansible.builtin.fail:
        msg: >-
          {{ item.name }} (pid {{ item.pid }}) already listens on port {{ item.port }}, which ServiceLB publishes for
          k3s (k3s.http_port, k3s.https_port, k3s.servicelb_ports). Its iptables redirect would silently take that
          traffic: stop or move {{ item.name }}, or don't run k3s on this host.
      loop: "{{ ansible_facts.tcp_listen | selectattr('port', 'in', k3s_published_ports) | unique(attribute='port') }}"
      loop_control:
        label: "{{ item.port }}"

    # ====================================================
    # Directories
    # ====================================================

    - name: Create k3s directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/rancher/k3s
        - /var/lib/rancher/k3s
        - /opt/k3s/install

    # ====================================================
    # Binary Download
    # ====================================================

    - name: Download k3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/v{{ k3s_config.version | replace('+', '%2B') }}/k3s"
        dest: "/opt/k3s/install/k3s-{{ k3s_config.version }}"
        owner: root
        group: root
        mode: "0755"
        checksum: "sha256:{{ k3s_checksums[k3s_config.version] }}"

    # The server runs from its own unpacked copy under /var/lib/rancher/k3s/data, so a new version only runs after a
    # restart. Also reported as changed while the server still runs another version: that catches up on a run that
    # failed before its restart, when the link was already switched.
    - name: Link k3s to /usr/local/bin
      ansible.builtin.file:
        src: "/opt/k3s/install/k3s-{{ k3s_config.version }}"
        dest: /usr/local/bin/k3s
        state: link
      register: k3s_link
      changed_when: k3s_link.changed or k3s_running_version not in ['', k3s_config.version]
      notify:
        - restart k3s

    # ====================================================
    # Cleanup old versions
    # ====================================================

    - name: Find old k3s binaries
      ansible.builtin.find:
        paths: /opt/k3s/install
        patterns: "k3s-*"
        use_regex: false
      register: k3s_old_binaries

    - name: Delete outdated k3s binaries
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ k3s_old_binaries.files }}"
      when: "'k3s-' ~ k3s_config.version not in item.path"

    # ====================================================
    # Symlinks (kubectl, crictl, ctr)
    # ====================================================

    - name: Create k3s tool symlinks
      ansible.builtin.file:
        src: /usr/local/bin/k3s
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kubectl
        - crictl
        - ctr

    # ====================================================
    # Config
    # ====================================================

    - name: Create k3s server configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
      notify:
        - restart k3s

    # ====================================================
    # Firewall
    # ====================================================
    # k3s always runs behind the firewall: this turns the firewall role on and registers the rules k3s
    # needs (see About.md):
    # - host -> pods (kubelet probes, API server -> pods): the firewall rejects outgoing traffic by default.
    # - pods -> anywhere (pod to pod, CoreDNS upstream): on hosts that also run Docker, the ufw-docker
    #   rules drop forwarded traffic to private addresses, which includes the pod network.
    # Pods -> host (e.g. the API) is accepted by Calico before UFW sees it, and service IPs are already
    # rewritten to pod IPs when UFW checks the packet.

    - name: Enable the firewall with the rules k3s needs # noqa: role-name[path] var-naming[no-role-prefix]
      ansible.builtin.import_role:
        name: security/firewall
      vars:
        run_role_firewall: true
        firewall_dropin_name: k3s
        firewall_dropin_rules:
          - direction: out
            to_ip: "{{ k3s_config.cluster_cidr }}"
            comment: host to k3s pods
          - route: true
            from_ip: "{{ k3s_config.cluster_cidr }}"
            comment: k3s pods to anywhere

    # ====================================================
    # Service
    # ====================================================

    - name: Setup k3s server systemd service
      ansible.builtin.template:
        src: k3s.service.j2
        dest: /lib/systemd/system/k3s.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart k3s

    # Now rather than at the end of the play: the steps below need the server with the new version, config and unit.
    # On a fresh host this restart is the first start, and the next task only enables k3s. It also runs the play's
    # other pending handlers, e.g. the firewall's.
    - name: Restart k3s now if its version, config or unit changed
      ansible.builtin.meta: flush_handlers

    - name: Enable and start k3s server
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    # ====================================================
    # Calico CNI
    # ====================================================

    - name: Wait for k3s to be ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      register: k3s_ready
      retries: 30
      delay: 5
      until: k3s_ready.rc == 0
      changed_when: false

    - name: Deploy Calico kubernetes-services-endpoint ConfigMap
      ansible.builtin.copy:
        src: files/calico-kubernetes-services-endpoint.yaml
        dest: /var/lib/rancher/k3s/server/manifests/calico-kubernetes-services-endpoint.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Deploy Calico manifest
      ansible.builtin.template:
        src: calico.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/calico.yaml
        owner: root
        group: root
        mode: "0600"

    # ====================================================
    # Traefik (ingress)
    # ====================================================
    # HelmChartConfig with the role's overrides of the Traefik chart (ports, HTTP -> HTTPS redirect). Always deployed,
    # with empty values when there is nothing to override: k3s does not delete resources when their manifest file is
    # removed, so deleting the file would leave the last overrides on. It replaces the empty traefik-config.yaml
    # deployed by earlier versions of this role (same file name), so two files never manage the same object.

    - name: Deploy Traefik configuration
      ansible.builtin.template:
        src: traefik-config.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        owner: root
        group: root
        mode: "0600"

    # ====================================================
    # Access control
    # ====================================================
    # The admin kubeconfig is root-only (write-kubeconfig-mode in config.yaml): ssh + sudo kubectl is the break-glass
    # path. It is also all that deploy tools get from this role: autobott-k8s sets up its own deploy user and robot
    # account with it. See About.md.

    # Interactive root shells (sudo su, sudo -i) get KUBECONFIG from /root/.bashrc.d (loaded by the root .bashrc
    # of base/enroll), so k9s, helm and other clients find the admin kubeconfig like k3s's kubectl does. Not a
    # /root/.kube/config: Ansible never reads .bashrc, so a kubernetes.core task running as root without explicit
    # credentials still fails instead of silently getting cluster admin.
    - name: Create root shell configuration directory
      ansible.builtin.file:
        path: /root/.bashrc.d
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Export KUBECONFIG in interactive root shells
      ansible.builtin.copy:
        content: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml\n"
        dest: /root/.bashrc.d/10_k3s.bashrc
        owner: root
        group: root
        mode: "0600"

    # ====================================================
    # Kill script (standard k3s tooling)
    # ====================================================

    - name: Install k3s-killall script
      ansible.builtin.template:
        src: k3s-killall.sh.j2
        dest: /usr/local/bin/k3s-killall.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install k3s-reset script
      ansible.builtin.template:
        src: k3s-reset.sh.j2
        dest: /usr/local/bin/k3s-reset.sh
        owner: root
        group: root
        mode: "0755"
