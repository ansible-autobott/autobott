---
# ============================================================================================================
# Firewall  Role Defaults
# ============================================================================================================

# Role execution flag
run_role_firewall: false

# User overrides - will be combined with firewall_defaults
firewall: {}
# Default configuration structure
firewall_defaults:

  allow_inbound_tcp:
    - 80 # HTTP
    - 443 # HTTPS

  allow_inbound_udp: []

  # Customize allowed outbound ports (e.g., DNS, HTTP/S, APT)
  allowed_outbound_tcp: []

  allowed_outbound_udp: []

  # make docker services not publicly available,
  # check https://github.com/chaifeng/ufw-docker# for details
  block_docker_public: true

  # allow local network to access docker interfaces
  allow_between_containers: true

# this is the bare minimum of ports needed for autobott to work.
# change at own risk if you know what you are doing.
# e.g. you can close port 22 if you have a working VPN.
firewall_required:

  allow_inbound_tcp:
    - 22 # SSH
  allow_inbound_udp: []

  allowed_outbound_tcp:
    - 53 # DNS
    - 80 # HTTP, needed e.g. for apt-get
    - 443 # HTTPS, needed e.g. for apt-get

  allowed_outbound_udp:
    - 53 # DNS

# Drop-in rules: other roles (e.g. k3s) register the UFW rules they need as one JSON file each in this
# directory. The firewall always applies every drop-in, so these rules survive the reset done on config changes.
firewall_dropin_dir: /etc/ufw/autobott.d

# Set by a role that imports the firewall role, writes <firewall_dropin_dir>/<name>.json before applying.
# Each rule takes community.general.ufw parameters: rule (default allow), route, direction, from_ip,
# to_ip, port, proto, interface, comment.
firewall_dropin_name: ""
firewall_dropin_rules: []
