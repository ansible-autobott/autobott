---
# ============================================================================================================
# dev-ai — AI coding agent tools role — defaults
# ============================================================================================================

# Master on/off for the whole role
run_role_dev_ai: true

# App selection. Keys are tool names; value is an optional { version: } override
# (must be one of that tool's catalogued versions below); an empty value installs
# the tool's default version.
# Example:
#   dev_ai_config:
#     herdr:
#     claude-code:
#       version: "2.1.267"
#     pi:
#     copilot-cli:
dev_ai_config: {}

# Source of truth for validation — every key allowed in dev_ai_config.
dev_ai_available:
  - herdr
  - claude-code
  - pi
  - copilot-cli

# Host CPU architecture (ansible_facts.architecture) -> its Debian name, which keys the
# per-architecture checksums in the catalogs below.
dev_ai_arch_names:
  x86_64: amd64
  aarch64: arm64

# claude-code, pi and copilot-cli name their Linux builds the Node way (Debian arch -> platform).
dev_ai_platforms:
  amd64: linux-x64
  arm64: linux-arm64

# ============================================================================================================
# Per-tool version catalogs (version -> architecture -> checksum)
# ============================================================================================================

# ----- herdr (runtime platform for coding agents) -----
# https://github.com/herdrdev/herdr/releases  (version -> arch -> sha256 of the linux binary)
herdr_default_version: "0.9.1"
herdr_versions:
  "0.9.0":
    amd64: "4fa1a01158dd8043da92d31b270780b0dcc10603038d9b61cac4d81ab63fb71f"
    arm64: "9c8db20fb7e7427b138d5367113f1621ffd319f2f65d6f009e2594029115f0d2"
  "0.9.1":
    amd64: "2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7"
    arm64: "f4ccf4de745f2cb9a39a983e9ba3703dad50ec2a58dea83026ceab721bbd8d9e"
herdr_base_url: "https://github.com/herdrdev/herdr/releases/download"
# Release binary per Debian arch (herdr names them after `uname -m`)
herdr_assets:
  amd64: herdr-linux-x86_64
  arm64: herdr-linux-aarch64

# ----- claude-code (Anthropic's coding agent CLI) -----
# Native binary from the release bucket; version -> arch -> sha256 of the <platform> binary,
# from <base_url>/<version>/manifest.json (.platforms["<platform>"].checksum).
# Latest stable version: <base_url>/stable
claude_code_default_version: "2.1.267"
claude_code_versions:
  "2.1.267":
    amd64: "0399c793ff571d5946ef923d80b4f330d05ac4b6842a6b0775468f5d389403c0"
    arm64: "226a4e009574044a18bf5495f127806b2a1bfcbf25b3c01608705fafee95fefb"
claude_code_base_url: "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases"

# ----- pi (pi coding agent) -----
# https://github.com/badlogic/pi-mono/releases  (version -> arch -> sha256 of pi-<platform>.tar.gz)
pi_default_version: "0.87.1"
pi_versions:
  "0.87.1":
    amd64: "80d78dd62d50049a006b981d994c61255bcc10e730b0c278d4ea0a755909764c"
    arm64: "364b4a9f8491450b27a4857d4e3c780dbaf696790821c176a873e860cbbc3b89"
pi_base_url: "https://github.com/badlogic/pi-mono/releases/download"

# ----- copilot-cli (GitHub Copilot CLI) -----
# https://github.com/github/copilot-cli/releases  (version -> arch -> sha256 of copilot-<platform>.tar.gz)
copilot_cli_default_version: "1.0.88"
copilot_cli_versions:
  "1.0.88":
    amd64: "42f40c08ff8a8ff78522161e4b5e2b86340ad8bb0853a5f1aa64ce65b48d007b"
    arm64: "e263f5f9eb0db5dddf5775ac98c437e27743857ce0ba310f08f2338aebd1107d"
copilot_cli_base_url: "https://github.com/github/copilot-cli/releases/download"
