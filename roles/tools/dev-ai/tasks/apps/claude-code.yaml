---
# ============================================================================================================
# claude-code — Anthropic's coding agent CLI
# https://code.claude.com/docs
#
# Installs the native Linux binary for the host architecture to
# /usr/local/bin/claude, pinned by version + sha256 (from the release
# manifest.json). The system-wide binary is root-owned, so Claude Code's
# self-updater cannot replace it; bump the version here instead.
#
# Also writes a per-user ~/.bashrc.d snippet with CLAUDE_CODE_TMPDIR and shell
# aliases (claude_code_tmpdir / claude_code_aliases).
# ============================================================================================================
- name: Resolve the selected Claude Code version
  ansible.builtin.set_fact:
    claude_code_version: "{{ (dev_ai_config['claude-code'] | default({}, true)).version | default(claude_code_default_version, true) }}"

- name: Validate the selected Claude Code version is available
  ansible.builtin.assert:
    that:
      - claude_code_version in claude_code_versions
      - dev_ai_arch in claude_code_versions[claude_code_version]
    fail_msg: >-
      Unknown claude-code version '{{ claude_code_version }}' for {{ dev_ai_arch }}.
      Available: {{ claude_code_versions | dict2items | selectattr('value', 'contains', dev_ai_arch) | map(attribute='key') | join(', ') }}

# `claude --version` prints "2.1.267 (Claude Code)".
- name: Get current Claude Code version
  ansible.builtin.shell: "set -o pipefail && claude --version | awk 'NR==1 {print $1}'"
  args:
    executable: /bin/bash
  register: claude_code_current_version
  failed_when: false
  changed_when: false

- name: Install or update Claude Code binary
  when: claude_code_current_version.stdout != claude_code_version
  ansible.builtin.get_url:
    url: "{{ claude_code_base_url }}/{{ claude_code_version }}/{{ dev_ai_platforms[dev_ai_arch] }}/claude"
    dest: /usr/local/bin/claude
    checksum: "sha256:{{ claude_code_versions[claude_code_version][dev_ai_arch] }}"
    owner: root
    group: root
    mode: "0755"

# ============================== per-user shell config ============================== #
# ~/.bashrc.d/20_claude-code.bashrc for every enabled linux-basic user (loaded by the
# .bashrc of base/linux-basic): CLAUDE_CODE_TMPDIR and the claude_code_aliases.
- name: Resolve the users that get per-user tool setup # noqa: role-name[path]
  ansible.builtin.import_role:
    name: base/linux-basic
    tasks_from: enabled_users
    allow_duplicates: false

- name: Make sure .bashrc.d exists
  ansible.builtin.file:
    path: "{{ item.home }}/.bashrc.d"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.group }}"
    mode: "0750"
  loop: "{{ linux_basic_enabled_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Copy the Claude Code .bashrc.d template
  ansible.builtin.template:
    src: claude-code/claude-code.bashrc.j2
    dest: "{{ item.home }}/.bashrc.d/20_claude-code.bashrc"
    owner: "{{ item.username }}"
    group: "{{ item.group }}"
    mode: "0640"
  loop: "{{ linux_basic_enabled_users }}"
  loop_control:
    label: "{{ item.username }}"
