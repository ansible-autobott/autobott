---
# ============================================================================================================
# herdr — runtime platform for coding agents
# https://herdr.dev
# https://github.com/herdrdev/herdr/releases  (version -> arch -> sha256 of the linux binary)
#
# Installs the upstream Linux release binary for the host architecture to
# /usr/local/bin/herdr, pinned by version + sha256. herdr is a CLI/runtime run
# by the user; this role only puts the binary on PATH.
# ============================================================================================================
- name: Resolve the selected herdr version
  ansible.builtin.set_fact:
    herdr_version: "{{ (dev_ai_config['herdr'] | default({}, true)).version | default(herdr_default_version, true) }}"

- name: Validate the selected herdr version is available
  ansible.builtin.assert:
    that:
      - herdr_version in herdr_versions
      - dev_ai_arch in herdr_versions[herdr_version]
    fail_msg: >-
      Unknown herdr version '{{ herdr_version }}' for {{ dev_ai_arch }}.
      Available: {{ herdr_versions | dict2items | selectattr('value', 'contains', dev_ai_arch) | map(attribute='key') | join(', ') }}

- name: Install herdr binary
  ansible.builtin.get_url:
    url: "{{ herdr_base_url }}/v{{ herdr_version }}/{{ herdr_assets[dev_ai_arch] }}"
    dest: /usr/local/bin/herdr
    checksum: "sha256:{{ herdr_versions[herdr_version][dev_ai_arch] }}"
    owner: root
    group: root
    mode: "0755"
