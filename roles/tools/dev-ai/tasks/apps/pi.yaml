---
# ============================================================================================================
# pi — pi coding agent
# https://pi.dev
#
# Unlike the other dev-ai tools, pi is installed per user so `pi update` can keep it
# current. pi's own installer (pi.dev/install.sh, vendored as files/pi_install.sh) is run once as every enabled
# linux-basic user, on the Node that dev-node installed into that user's nvm. It
# puts pi in ~/.pi/agent/install (outside ~/.nvm, so switching Node versions does not
# hide it) and links a launcher into ~/.local/bin. After that, `pi update` owns pi;
# the role does not pin or update its version.
#
# Depends on dev-node: 'node' must be selected in dev_node_config.
# ============================================================================================================
- name: Check that dev-node installs Node for pi
  ansible.builtin.fail:
    msg: "pi needs Node from dev-node: add 'node' to dev_node_config."
  when: "'node' not in (dev_node_config | default({}, true))"

- name: Resolve the users that get per-user tool setup # noqa: role-name[path]
  ansible.builtin.import_role:
    name: base/linux-basic
    tasks_from: enabled_users
    allow_duplicates: false

# Older autobott versions installed pi system-wide from the release tarball. pi's
# installer stops (without a terminal) when another pi is on PATH, so remove it.
- name: Check for the system-wide pi from older autobott versions
  ansible.builtin.stat:
    path: /usr/local/bin/pi
  register: pi_system_link

- name: Remove the system-wide pi link
  ansible.builtin.file:
    path: /usr/local/bin/pi
    state: absent
  when:
    - pi_system_link.stat.islnk | default(false)
    - pi_system_link.stat.lnk_target == '/opt/pi/pi'

- name: Find the system-wide pi installs
  ansible.builtin.find:
    paths: /opt
    # only /opt/pi and /opt/pi-<version>, not other tools such as /opt/pi-hole
    patterns: '^pi(-\d+\.\d+\.\d+)?$'
    use_regex: true
    file_type: any
  register: pi_system_installs

- name: Remove the system-wide pi installs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ pi_system_installs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check which users already have pi
  ansible.builtin.stat:
    path: "{{ item.home }}/.pi/agent/install/managed-install.json"
  register: pi_stat
  loop: "{{ linux_basic_enabled_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Install pi for the users that lack it
  when: pi_stat.results | rejectattr('stat.exists') | list | length > 0
  block:
    # Vendored copy of pi.dev/install.sh (files/pi_install.sh), so a changed upstream
    # script is never run unreviewed.
    - name: Copy the pi installer
      ansible.builtin.copy:
        src: pi_install.sh
        dest: /tmp/pi_install.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install pi for each user
      ansible.builtin.include_tasks: pi_user.yaml
      loop: "{{ linux_basic_enabled_users }}"
      loop_control:
        loop_var: pi_user
        label: "{{ pi_user.username }}"

    - name: Remove the pi installer
      ansible.builtin.file:
        path: /tmp/pi_install.sh
        state: absent
