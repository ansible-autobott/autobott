---
# ============================================================================================================
# dev-generic — generic developer tools role — defaults
# ============================================================================================================

# Master on/off for the whole role
run_role_dev_generic: true

# App selection. Keys are tool names. vault accepts an optional { version: }
# override (must be a catalogued version below); an empty value installs the
# tool's default version. vagrant and github-cli install the latest
# from their apt repos and take no version.
# Example:
#   dev_generic_config:
#     vagrant:
#     vault:
#       version: "1.15.4"
#     github-cli:
dev_generic_config: {}

# Source of truth for validation — every key allowed in dev_generic_config.
dev_generic_available:
  - vagrant
  - vault
  - github-cli

# Host CPU architecture (ansible_facts.architecture) -> its Debian name, which selects
# the download and keys the per-architecture checksums in the catalogs below.
dev_generic_arch_names:
  x86_64: amd64
  aarch64: arm64

# ============================================================================================================
# Per-tool version catalogs (version -> architecture -> checksum)
# ============================================================================================================

# ----- vault -----
# https://releases.hashicorp.com/vault/  (version -> arch -> sha256 of the linux_<arch> zip)
vault_default_version: "2.1.1"
vault_versions:
  "1.15.4":
    amd64: "f42f550713e87cceef2f29a4e2b754491697475e3d26c0c5616314e40edd8e1b"
    arm64: "79aee168078eb8c0dbb31c283e1136a7575f59fe36fccbb1f1ef6a16e0b67fdb"
  "2.1.1":
    amd64: "8aa90f9cea46f541fc7baa3d0ec692fc06afde9a248cc1f2dcac46a567c6f56b"
    arm64: "c2c74e111ffbc83b3d29c6f0c0215a5e53d738c9fad045f7797bcdcde3156067"

# vagrant / github-cli install the latest from their apt repos; no version pin.
