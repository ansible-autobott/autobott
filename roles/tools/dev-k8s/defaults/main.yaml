---
# ============================================================================================================
# dev-k8s — Kubernetes developer tools role — defaults
# ============================================================================================================

# Master on/off for the whole role
run_role_dev_k8s: true

# App selection. Keys are tool names; value is an optional per-tool override
# dict. kubectl accepts { version:, kubelogin_version: }; k9s accepts { version: }.
# Each version must be one of that tool's catalogued versions below; an empty
# value installs the default versions.
# Example:
#   dev_k8s_config:
#     kubectl:
#       version: "v1.31.0"
#       kubelogin_version: "v0.0.34"
#     k9s:
dev_k8s_config: {}

# Source of truth for validation — every key allowed in dev_k8s_config.
dev_k8s_available:
  - kubectl
  - k9s

# Host CPU architecture (ansible_facts.architecture) -> its Debian name, which selects
# the download and keys the per-architecture checksums in the catalogs below.
dev_k8s_arch_names:
  x86_64: amd64
  aarch64: arm64

# ============================================================================================================
# Per-tool version catalogs (version -> architecture -> sha256)
# ============================================================================================================

# ----- kubectl -----
# https://kubernetes.io/releases/  (version -> arch -> sha256 of the linux/<arch> binary,
# from https://dl.k8s.io/release/<version>/bin/linux/<arch>/kubectl.sha256)
kubectl_default_version: "v1.37.0"
kubectl_versions:
  "v1.31.0":
    amd64: "7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437"
    arm64: "f42832db7d77897514639c6df38214a6d8ae1262ee34943364ec1ffaee6c009c"
  "v1.37.0":
    amd64: "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f"
    arm64: "922df28df248cc00a9e025f947704f1d1482de64ece54cfe57e61f19eaf1eef3"

# ----- kubelogin (Azure AD auth plugin for kubectl; installed alongside kubectl) -----
# https://github.com/Azure/kubelogin/releases  (version -> arch -> sha256 of the linux-<arch> zip)
kubelogin_default_version: "v0.2.19"
kubelogin_versions:
  "v0.0.34":
    amd64: "de2a529b4b044f6d41b82cd256c9d9fba44a68ad3c48f2d68e1c093eba51db02"
    arm64: "b0e8b23d26ad6fe7245acf01516171f19581842c7db4e89c5564955a3fe87ee2"
  "v0.2.19":
    amd64: "ebaeff02aa899c5cae6a2b954b64fc02738185319df2570f7dc053451efa4b2f"
    arm64: "aad7e7ca2a8e67db15b110e535123c1bc0f31ef488f5d3ab5b9ae7c9de6f48d3"

# ----- k9s -----
# https://github.com/derailed/k9s/releases  (version -> arch -> sha256 of the Linux_<arch> tarball)
k9s_default_version: "v0.51.0"
k9s_versions:
