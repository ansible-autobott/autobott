---
# ============================================================================================================
# k9s
# https://github.com/derailed/k9s/releases  (version -> arch -> sha256 of the Linux_<arch> tarball)
# ============================================================================================================
- name: Resolve the selected k9s version
  ansible.builtin.set_fact:
    k9s_version: "{{ (dev_k8s_config['k9s'] | default({}, true)).version | default(k9s_default_version, true) }}"

- name: Validate the selected k9s version is available
  ansible.builtin.assert:
    that:
      - k9s_version in k9s_versions
      - dev_k8s_arch in k9s_versions[k9s_version]
    fail_msg: >-
      Unknown k9s version '{{ k9s_version }}' for {{ dev_k8s_arch }}.
      Available: {{ k9s_versions | dict2items | selectattr('value', 'contains', dev_k8s_arch) | map(attribute='key') | join(', ') }}

- name: Get current k9s version
  ansible.builtin.shell: "set -o pipefail && k9s version --short | grep Version | awk -F ' ' '{print $2}'"
  args:
    executable: /bin/bash
  register: k9s_current_version
  failed_when: false
  changed_when: false

- name: Install or update k9s
  when: k9s_current_version.stdout != k9s_version
  block:
    - name: Create k9s download dir
      ansible.builtin.file:
        path: "/tmp/k9s"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Download k9s
      ansible.builtin.get_url:
        url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_Linux_{{ dev_k8s_arch }}.tar.gz"
        dest: "/tmp/k9s/k9s.tar.gz"
        checksum: "sha256:{{ k9s_versions[k9s_version][dev_k8s_arch] }}"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack k9s
      ansible.builtin.unarchive:
        src: "/tmp/k9s/k9s.tar.gz"
        dest: "/tmp/k9s"
        remote_src: true

    - name: Move k9s
      ansible.builtin.command: "mv /tmp/k9s/k9s /usr/local/bin/k9s"
      changed_when: true

    - name: Remove k9s download dir
      ansible.builtin.file:
        path: "/tmp/k9s"
        state: absent

    - name: Ensure k9s is executable
      ansible.builtin.file:
        path: "/usr/local/bin/k9s"
        state: file
        mode: "0755"
        owner: root
        group: root
