---
# ============================================================================================================
# dev-node — Node.js developer tools role — defaults
# ============================================================================================================

# Master on/off for the whole role
run_role_dev_node: true

# App selection. The `node` key installs nvm plus the latest Node LTS, once: only
# when the user has no Node yet. After that the user manages Node with nvm
# (`nvm install`, `nvm alias default`); the role never adds or switches versions.
# Optional overrides:
#   nvm_version: catalogued nvm version to install (sha-verified).
#   packages:    global npm packages for every user. Installed into the user's
#                default Node when missing (never upgraded or removed), and written
#                to ~/.nvm/default-packages so `nvm install` adds them to each new
#                Node too. Package names may carry a version (e.g. "pkg@1.2.3").
# Example:
#   dev_node_config:
#     node:
#       nvm_version: "0.40.8"
#       packages:
#         - "@tobilu/qmd"
dev_node_config: {}

# Source of truth for validation — every key allowed in dev_node_config.
dev_node_available:
  - node

# ============================================================================================================
# nvm version catalog (version -> sha256 of the upstream install.sh)
# https://github.com/nvm-sh/nvm/releases
# ============================================================================================================
nvm_default_version: "0.40.8"
nvm_versions:
  "0.40.7": "066ce4eaf4d78eaa6410433bc9ba58faaba646157cbbed6109153e6c24c5f8a5"
  "0.40.8": "48a0eee9a60e07422dce0eb5774754c83889570ca1ee2566c516acbe8af03a9e"
