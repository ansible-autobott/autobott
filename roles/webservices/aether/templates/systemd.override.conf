# Managed by Ansible (roles/webservices/aether).
# Drop-in override for the packaged /lib/systemd/system/aether.service unit.
[Service]
{% if aether_config.umask | default('') | length > 0 %}
UMask={{ aether_config.umask }}
{% endif %}
{% for path in aether_config.readwrite_paths | default([]) %}
ReadWritePaths={{ path }}
{% endfor %}
